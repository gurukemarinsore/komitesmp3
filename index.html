<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>Komite SMP Negeri 3 Jayapura</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/GO3QUoB.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f8fc;
      --surface: #ffffff;
      --surface-2: #f8fbff;
      --text: #10233a;
      --muted: #65758a;
      --line: #e5edf6;
      --navy: #0b3158;
      --blue: #1769d2;
      --blue-2: #3d8df5;
      --cyan: #8bdcff;
      --green: #168b63;
      --green-soft: #eaf8f2;
      --orange: #d97706;
      --orange-soft: #fff5e8;
      --red: #c43b4d;
      --red-soft: #fff0f2;
      --shadow: 0 14px 40px rgba(25, 65, 110, .09);
      --shadow-soft: 0 8px 26px rgba(25, 65, 110, .07);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans Flex", "Google Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 1; background:#e7ecf2 !important; border-color:#e7ecf2 !important; color:#8b98a8 !important; box-shadow:none !important; transform:none !important; }
    a { color: inherit; }
    .hidden { display: none !important; }

    .app-root { min-height: 100vh; }
    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .main { padding: 24px 0 104px; }

    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,.91);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(229,237,246,.88);
    }
    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 15px;
      display: grid; place-items: center; color: white;
      background: linear-gradient(145deg, var(--navy), var(--blue) 60%, #6dc8f8);
      box-shadow: 0 10px 24px rgba(23,105,210,.24);
      flex: 0 0 auto;
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-text { min-width: 0; }
    .brand-title { font-weight: 720; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .user-pill {
      display: flex; align-items: center; gap: 9px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
      color: var(--muted); font-size: 13px;
    }
    .user-pill strong { color: var(--text); font-weight: 650; }
    .icon-btn {
      width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--surface); color: var(--text); display: grid; place-items: center;
      transition: .18s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); border-color: #cbdced; background: var(--surface-2); }
    .icon-btn svg { width: 20px; height: 20px; }

    .desktop-nav { display: flex; gap: 6px; padding: 10px; background: white; border: 1px solid var(--line); border-radius: 18px; margin-top: 18px; }
    .nav-chip {
      flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); border-radius: 12px;
      padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px;
    }
    .nav-chip.active { background: #eef6ff; color: var(--blue); }
    .nav-chip svg { width: 18px; height: 18px; }

    .hero {
      margin-top: 22px;
      border-radius: var(--radius-xl);
      padding: 28px;
      color: white;
      background:
        radial-gradient(circle at 82% 15%, rgba(139,220,255,.38), transparent 31%),
        radial-gradient(circle at 15% 90%, rgba(61,141,245,.25), transparent 38%),
        linear-gradient(135deg, #092f55 0%, #0f579e 52%, #2b87e9 100%);
      box-shadow: 0 20px 50px rgba(9, 60, 110, .18);
      overflow: hidden;
      position: relative;
    }
    .hero::after {
      content: ""; position: absolute; width: 240px; height: 240px; right: -100px; bottom: -160px;
      border: 1px solid rgba(255,255,255,.18); border-radius: 50%; box-shadow: 0 0 0 28px rgba(255,255,255,.035), 0 0 0 56px rgba(255,255,255,.025);
    }
    .hero-kicker { font-size: 13px; opacity: .78; letter-spacing: .02em; }
    .hero-title { margin: 7px 0 4px; font-size: clamp(25px, 4vw, 40px); font-weight: 760; letter-spacing: -.035em; }
    .hero-sub { opacity: .78; font-size: 14px; }
    .hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 28px; max-width: 720px; }
    .hero-stat { padding: 14px 16px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); border-radius: 17px; backdrop-filter: blur(8px); }
    .hero-stat small { display: block; opacity: .72; font-size: 12px; }
    .hero-stat strong { display: block; margin-top: 4px; font-size: clamp(20px, 3vw, 29px); font-weight: 730; }

    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 28px 0 14px; }
    .section-head h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .action-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .action-card {
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-lg); padding: 18px;
      text-align: left; min-height: 134px; box-shadow: var(--shadow-soft); transition: .18s ease; color: var(--text);
    }
    .action-card:hover { transform: translateY(-2px); border-color: #cfe0f1; box-shadow: var(--shadow); }
    .action-icon { width: 42px; height: 42px; border-radius: 14px; background: #eef6ff; color: var(--blue); display: grid; place-items: center; }
    .action-icon svg { width: 21px; height: 21px; }
    .action-card strong { display: block; margin-top: 18px; font-weight: 690; }
    .action-card > span:not(.action-icon) { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .action-card.primary { background: linear-gradient(145deg, #f4f9ff, #ffffff); border-color: #cfe6ff; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); }
    .card-pad { padding: 20px; }
    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .toolbar.three { grid-template-columns: 1fr 180px 180px; }
    .field-wrap { position: relative; }
    .field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8192a6; pointer-events: none; display: grid; }
    .field-icon svg { width: 18px; height: 18px; }
    .input, .select {
      width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 14px; background: #fbfdff;
      color: var(--text); padding: 0 14px; outline: none; transition: .16s ease;
    }
    .field-wrap .input { padding-left: 43px; }
    .input:focus, .select:focus { border-color: #80b9f4; box-shadow: 0 0 0 4px rgba(23,105,210,.08); background: white; }
    .label { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin: 0 0 7px 2px; }

    .btn {
      min-height: 46px; border: 0; border-radius: 14px; padding: 0 17px; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-weight: 650; transition: .18s ease; white-space: nowrap;
    }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { color: white; background: linear-gradient(135deg, var(--navy), var(--blue) 68%, #4ea4f3); box-shadow: 0 9px 22px rgba(23,105,210,.19); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 11px 26px rgba(23,105,210,.24); }
    .btn-soft { color: var(--blue); background: #edf6ff; border: 1px solid #d8ebff; }
    .btn-ghost { color: var(--text); background: white; border: 1px solid var(--line); }
    .btn-danger { color: var(--red); background: var(--red-soft); border: 1px solid #ffd8dd; }
    .btn-sm { min-height: 38px; padding: 0 12px; border-radius: 12px; font-size: 13px; }

    .student-list { display: grid; gap: 9px; margin-top: 16px; }
    .student-row {
      width: 100%; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 12px;
      padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: white; color: var(--text); text-align: left; transition: .16s ease;
    }
    .student-row:hover { border-color: #cfe0f1; background: #fbfdff; }
    .avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #edf6ff; color: var(--blue); font-weight: 730; }
    .student-main { min-width: 0; }
    .student-main strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student-meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 7px; flex-wrap: wrap; }
    .chev { color: #9aabba; display: grid; }
    .chev svg { width: 18px; height: 18px; }

    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .status-pill.ok { background: var(--green-soft); color: var(--green); }
    .status-pill.wait { background: var(--orange-soft); color: var(--orange); }
    .status-pill.future { background: #f1f4f7; color: #77879a; }
    .status-pill.cancel { background: var(--red-soft); color: var(--red); }
    .status-pill svg { width: 14px; height: 14px; }

    .months-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .month-card { border: 1px solid var(--line); border-radius: 17px; padding: 14px; background: white; min-height: 100px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
    .month-card.clickable { cursor: pointer; transition: .16s ease; }
    .month-card.clickable:hover { border-color: #8fc2f4; background: #f8fbff; transform: translateY(-1px); }
    .month-name { font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--text); }
    .month-year { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .history-list { display: grid; gap: 10px; }
    .history-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .history-row:last-child { border-bottom: 0; }
    .history-row strong { display: block; font-size: 14px; }
    .history-row .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .history-amount { text-align: right; }
    .history-amount strong { font-variant-numeric: tabular-nums; }

    .summary-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-top: 16px; }
    .metric { padding: 17px; border: 1px solid var(--line); border-radius: 18px; background: white; }
    .metric span { color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 5px; font-size: 24px; letter-spacing: -.03em; }

    .empty { text-align: center; padding: 42px 20px; color: var(--muted); }
    .empty-icon { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 18px; display: grid; place-items: center; background: #f1f6fb; color: #7c91a7; }
    .empty-icon svg { width: 24px; height: 24px; }
    .empty strong { color: var(--text); display: block; margin-bottom: 4px; }

    .bottom-nav {
      display: none; position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--safe-bottom));
      width: min(94%, 480px); padding: 7px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 18px 48px rgba(18, 57, 95, .16); backdrop-filter: blur(18px);
    }
    .bottom-nav button { flex: 1; min-height: 54px; border: 0; background: transparent; border-radius: 16px; color: var(--muted); display: grid; place-items: center; gap: 2px; font-size: 10px; }
    .bottom-nav button.active { color: var(--blue); background: #eef6ff; }
    .bottom-nav svg { width: 20px; height: 20px; }

    .login-page {
      min-height: 100vh; display: grid; grid-template-columns: minmax(0,1.1fr) minmax(400px,.9fr); background: white;
    }
    .login-art {
      position: relative; overflow: hidden; padding: 52px; color: white;
      background:
        radial-gradient(circle at 20% 18%, rgba(139,220,255,.38), transparent 28%),
        radial-gradient(circle at 78% 78%, rgba(58,144,245,.28), transparent 36%),
        linear-gradient(145deg, #092c50 0%, #0f4e8d 48%, #2481df 100%);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .login-art::before, .login-art::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; }
    .login-art::before { width: 480px; height: 480px; right: -260px; top: -180px; box-shadow: 0 0 0 54px rgba(255,255,255,.025), 0 0 0 108px rgba(255,255,255,.018); }
    .login-art::after { width: 320px; height: 320px; left: -180px; bottom: -170px; box-shadow: 0 0 0 42px rgba(255,255,255,.022); }
    .login-brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
    .login-brand .brand-mark { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); box-shadow: none; }
    .login-copy { position: relative; z-index: 1; max-width: 620px; }
    .login-copy h1 { font-size: clamp(36px,5vw,68px); line-height: .99; letter-spacing: -.052em; margin: 0 0 18px; font-weight: 780; }
    .login-copy p { max-width: 520px; margin: 0; opacity: .76; font-size: 16px; line-height: 1.55; }
    .login-mini { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; }
    .login-mini span { padding: 8px 11px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); border-radius: 999px; font-size: 11px; opacity: .88; }
    .login-panel { display: grid; place-items: center; padding: 34px; background: #fbfdff; }
    .login-box { width: min(100%, 470px); }
    .login-mobile-brand { display: none; margin-bottom: 24px; }
    .login-box h2 { margin: 0; font-size: 30px; letter-spacing: -.035em; }
    .login-box > p { margin: 8px 0 22px; color: var(--muted); line-height: 1.5; }
    .segment { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; padding: 5px; background: #eef3f8; border-radius: 15px; margin-bottom: 22px; }
    .segment button { border: 0; background: transparent; min-height: 42px; border-radius: 11px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .segment button.active { background: white; color: var(--blue); box-shadow: 0 3px 12px rgba(25,65,110,.08); }
    .form-stack { display: grid; gap: 14px; }
    .login-btn { min-height: 51px; width: 100%; margin-top: 2px; }
    .login-foot { color: var(--muted); font-size: 11px; line-height: 1.45; margin-top: 18px; text-align: center; }

    .student-profile-hero { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 18px; }
    .student-profile-hero .amount { font-size: clamp(29px,5vw,48px); font-weight: 760; letter-spacing: -.045em; margin-top: 18px; }
    .student-profile-hero .amount-label { font-size: 12px; opacity: .7; }
    .student-profile-hero .paid-circle { width: 112px; height: 112px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); display: grid; place-items: center; text-align: center; }
    .paid-circle strong { font-size: 27px; display: block; }
    .paid-circle span { opacity: .72; font-size: 11px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(9,30,52,.46); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 18px; animation: fadeIn .16s ease; }
    .modal {
      width: min(760px, 100%); max-height: min(90vh, 900px); overflow: auto; background: white; border: 1px solid rgba(255,255,255,.7);
      border-radius: 26px; box-shadow: 0 28px 80px rgba(5,31,58,.25); animation: pop .2s ease;
    }
    .modal.large { width: min(920px, 100%); }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 20px 14px; background: rgba(255,255,255,.95); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; font-size: 19px; }
    .modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px 20px; }

    .receipt { text-align: center; padding: 6px 4px; }
    .success-mark { width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center; color: var(--green); background: var(--green-soft); }
    .success-mark svg { width: 32px; height: 32px; }
    .receipt h3 { margin: 0; font-size: 23px; }
    .receipt .receipt-name { margin-top: 18px; font-size: 17px; font-weight: 680; }
    .receipt .receipt-amount { font-size: 31px; font-weight: 770; letter-spacing: -.035em; margin: 7px 0; }
    .receipt-details { margin: 18px auto 0; max-width: 450px; border: 1px solid var(--line); border-radius: 17px; overflow: hidden; text-align: left; }
    .receipt-details div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 13px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .receipt-details div:last-child { border-bottom: 0; }
    .receipt-details span { color: var(--muted); }

    .toast-container { position: fixed; z-index: 100; top: 18px; right: 18px; width: min(390px, calc(100% - 28px)); display: grid; gap: 10px; pointer-events: none; }
    .toast { pointer-events: auto; display: grid; grid-template-columns: 34px minmax(0,1fr) 28px; gap: 9px; align-items: center; padding: 11px; background: rgba(255,255,255,.98); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 46px rgba(15,47,80,.16); animation: toastIn .25s ease; }
    .toast-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; }
    .toast-icon svg { width: 17px; height: 17px; }
    .toast.success .toast-icon { color: var(--green); background: var(--green-soft); }
    .toast.error .toast-icon { color: var(--red); background: var(--red-soft); }
    .toast.warning .toast-icon { color: var(--orange); background: var(--orange-soft); }
    .toast.info .toast-icon { color: var(--blue); background: #edf6ff; }
    .toast strong { display: block; font-size: 13px; }
    .toast p { margin: 2px 0 0; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .toast-close { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; color: #91a0ae; border-radius: 9px; }
    .toast-close svg { width: 15px; height: 15px; }

    .loading-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(248,251,255,.76); backdrop-filter: blur(4px); display: grid; place-items: center; }
    .loader-card { display: flex; align-items: center; gap: 11px; padding: 13px 16px; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); color: var(--muted); font-size: 13px; }
    .spinner { width: 19px; height: 19px; border: 2px solid #d7e5f3; border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }

    @media (max-width: 860px) {
      .login-page { grid-template-columns: 1fr; background: #fbfdff; }
      .login-art { display: none; }
      .login-panel { padding: 24px; min-height: 100vh; }
      .login-mobile-brand { display: flex; align-items: center; gap: 12px; }
      .desktop-nav { display: none; }
      .bottom-nav { display: flex; }
      .main { padding-top: 14px; }
      .action-grid { grid-template-columns: repeat(3,1fr); }
      .action-card { min-height: 120px; padding: 15px; }
      .toolbar.three { grid-template-columns: 1fr 145px; }
      .toolbar.three > :last-child { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: repeat(2,1fr); }
      .months-grid { grid-template-columns: repeat(3,1fr); }
      .user-pill { display: none; }
    }

    @media (max-width: 600px) {
      .page { width: min(100% - 22px, 1180px); }
      .topbar { min-height: 64px; }
      .brand-mark { width: 40px; height: 40px; border-radius: 13px; }
      .brand-title { font-size: 14px; max-width: 210px; }
      .brand-sub { font-size: 10px; }
      .hero { padding: 21px; border-radius: 24px; margin-top: 13px; }
      .hero-stats { grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 22px; }
      .hero-stat { padding: 11px 9px; border-radius: 14px; }
      .hero-stat strong { font-size: 21px; }

    async function copyAccountNumber(number) {
      const text = String(number || '').replace(/\D/g,'');
      if (!text) return;
      try {
        if (navigator.clipboard?.writeText && window.isSecureContext) await navigator.clipboard.writeText(text);
        else {
          const area = document.createElement('textarea');
          area.value = text; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; area.style.pointerEvents='none';
          document.body.appendChild(area); area.select();
          const ok = document.execCommand('copy'); area.remove();
          if (!ok) throw new Error('copy');
        }
        toast('Nomor rekening berhasil disalin.', 'success');
      } catch (_) {
        toast('Nomor rekening belum dapat disalin. Silakan salin secara manual.', 'warning');
      }
    }

    function safeJson(text) {
      try { return text ? JSON.parse(text) : null; } catch (_) { return null; }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function titleCase(text) {
      const s = String(text || '').toLowerCase();
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    }

    function normalizeClassLabel(value) {
      let s = String(value || '').toUpperCase().trim().replace(/[._-]+/g,' ').replace(/\s+/g,' ');
      let m = s.match(/^VII\s*([A-J])$/);
      if (m) return '7' + m[1];
      m = s.match(/^7\s*([A-J])$/);
      return m ? '7' + m[1] : s;
    }

    function todayJayapuraIso() {
      const parts = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Jayapura', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
      const o = Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
      return `${o.year}-${o.month}-${o.day}`;
    }

    function money(value) {
      return new Intl.NumberFormat('id-ID', {style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(value || 0));
    }

    function initials(name) {
      const p = String(name || '').trim().split(/\s+/).filter(Boolean);
      return (p[0]?.[0] || '') + (p[1]?.[0] || p[0]?.[1] || '');
    }

    function isApiConfigured() {
      return /^https:\/\/.+\/exec(?:\?.*)?$/.test(API_URL) && !API_URL.includes('PASTE_URL');
    }

    function isSessionError(message) {
      return /sesi (tidak valid|telah berakhir)/i.test(String(message || ''));
    }

    function isNetworkLikeError(err) {
      const m = String(err?.message || err || '');
      return !navigator.onLine || /fetch|network|failed|abort|timeout|terhubung/i.test(m);
    }

    async function api(action, data = {}, opts = {}) {
      if (!isApiConfigured()) throw new Error('Konfigurasi layanan belum lengkap.');
      const timeout = Number(opts.timeout || 18000);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      if (!opts.silent) loading(true, opts.loadingText || 'Memuat data…');
      try {
        const payload = Object.assign({ action }, data);
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: new URLSearchParams({ payload: JSON.stringify(payload) }),
          redirect: 'follow',
          signal: controller.signal
        });
        const text = await res.text();
        let json;
        try { json = JSON.parse(text); }
        catch (_) { throw new Error('Layanan sedang tidak dapat diakses. Silakan coba lagi.'); }
        if (!json.ok) throw new Error(json.message || 'Permintaan gagal.');
        return json.data;
      } catch (err) {
        const mapped = err?.name === 'AbortError' ? new Error('Koneksi terlalu lambat. Silakan coba lagi.') : err;
        if (isSessionError(mapped?.message)) {
          clearSession(false);
          renderLogin();
        }
        throw mapped;
      } finally {
        clearTimeout(timer);
        if (!opts.silent) loading(false);
      }
    }

    function loading(show, text='Memuat data…') {
      const label = document.getElementById('loadingText');
      const overlay = document.getElementById('loadingOverlay');
      if (label) label.textContent = text;
      if (overlay) overlay.classList.toggle('hidden', !show);
    }

    function toast(message, type='info', title='', duration) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const map = {
        success: {icon:'check', title:'Berhasil'},
        error: {icon:'alert', title:'Terjadi kesalahan'},
        warning: {icon:'alert', title:'Perhatian'},
        info: {icon:'info', title:'Informasi'}
      };
      const m = map[type] || map.info;
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<div class="toast-icon">${icon(m.icon)}</div><div class="toast-copy"><strong>${escapeHtml(title || m.title)}</strong><p>${escapeHtml(message)}</p></div><button class="toast-close" aria-label="Tutup">${icon('x')}</button>`;
      container.appendChild(el);

      let timer = setTimeout(() => dismissToast(el, 'fade'), Number(duration || (type === 'error' ? 5600 : type === 'warning' ? 4800 : 3900)));
      el._toastTimer = timer;
      el.querySelector('.toast-close').addEventListener('click', e => {
        e.stopPropagation();
        dismissToast(el, 'right');
      });
      attachToastGesture(el);
    }

    function attachToastGesture(el) {
      let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
      el.addEventListener('pointerdown', e => {
        if (e.target.closest('.toast-close')) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        dx = 0; dy = 0;
        el.classList.add('dragging');
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        if (el._toastTimer) clearTimeout(el._toastTimer);
      });
      el.addEventListener('pointermove', e => {
        if (!dragging) return;
        dx = e.clientX - startX;
        dy = Math.min(0, e.clientY - startY);
        const opacity = Math.max(.28, 1 - Math.max(Math.abs(dx) / 210, Math.abs(dy) / 150));
        el.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
        el.style.opacity = String(opacity);
      });
      const finish = e => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
        if (Math.abs(dx) >= 68) dismissToast(el, dx < 0 ? 'left' : 'right');
        else if (dy <= -48) dismissToast(el, 'up');
        else {
          el.style.transform = '';
          el.style.opacity = '';
          el._toastTimer = setTimeout(() => dismissToast(el, 'fade'), 2400);
        }
      };
      el.addEventListener('pointerup', finish);
      el.addEventListener('pointercancel', finish);
    }

    function dismissToast(el, direction='fade') {
      if (!el || !el.isConnected || el.dataset.closing === '1') return;
      el.dataset.closing = '1';
      if (el._toastTimer) clearTimeout(el._toastTimer);
      el.classList.remove('dragging');
      el.style.transition = 'transform .22s ease, opacity .22s ease';
      if (direction === 'left') el.style.transform = 'translate3d(-120%,0,0)';
      else if (direction === 'right') el.style.transform = 'translate3d(120%,0,0)';
      else el.style.transform = 'translate3d(0,-28px,0)';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 230);
    }

    // ========================= ANTREAN PEMBAYARAN OFFLINE =========================

    function getPaymentQueue() {
      const q = safeJson(localStorage.getItem(STORAGE.QUEUE));
      return Array.isArray(q) ? q : [];
    }

    function savePaymentQueue(queue) {
      localStorage.setItem(STORAGE.QUEUE, JSON.stringify(queue));
      updateSyncIndicator();
    }

    function queueCount() { return getPaymentQueue().length; }

    function pendingPayment(idSiswa, bulan, tahun) {
      return getPaymentQueue().find(x => x.idSiswa === idSiswa && x.bulan === bulan && Number(x.tahun) === Number(tahun)) || null;
    }

    function makeClientTransactionId() {
      const random = (globalThis.crypto?.getRandomValues ? Array.from(crypto.getRandomValues(new Uint32Array(2))).map(n=>n.toString(36)).join('') : Math.random().toString(36).slice(2,14));
      return `TRX-LOCAL-${Date.now().toString(36)}-${random}`.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,64);
    }

    function enqueuePayment(idSiswa, bulan, tahun, student, paymentDate) {
      const queue = getPaymentQueue();
      const existing = queue.find(x => x.idSiswa === idSiswa && x.bulan === bulan && Number(x.tahun) === Number(tahun));
      if (existing) return {item:existing, duplicate:true};
      const item = {
        clientId: makeClientTransactionId(),
        idSiswa,
        bulan,
        tahun:Number(tahun),
        tanggalPembayaran: paymentDate || todayJayapuraIso(),
        student: {nama:student?.nama || '', nisn:student?.nisn || '', kelas:normalizeClassLabel(student?.kelas || '')},
        createdAt: Date.now(),
        attempts: 0,
        lastError: ''
      };
      queue.push(item);
      savePaymentQueue(queue);
      return {item, duplicate:false};
    }

    function removeQueueItem(clientId) {
      savePaymentQueue(getPaymentQueue().filter(x => x.clientId !== clientId));
    }

    function updateQueueFailure(clientId, message) {
      const queue = getPaymentQueue();
      const item = queue.find(x => x.clientId === clientId);
      if (item) {
        item.attempts = Number(item.attempts || 0) + 1;
        item.lastError = String(message || '');
        item.lastAttemptAt = Date.now();
        savePaymentQueue(queue);
      }
    }

    function syncChipHtml() {

    function syncCenterBodyHtml() {
      const queue = getPaymentQueue();
      const offline = !navigator.onLine;

      const title = queue.length ? `${queue.length} pembayaran menunggu` : 'Semua data sudah tersinkron';
      const desc = queue.length
        ? (offline ? 'Data tetap aman di perangkat. Sinkronisasi akan dilakukan saat koneksi tersedia.' : syncing ? 'Sedang mengirim pembayaran. Daftar akan berkurang setelah setiap data dikonfirmasi.' : 'Pembayaran berikut belum terkirim. Tekan Sinkronkan Sekarang atau tunggu proses otomatis.')
        : 'Tidak ada pembayaran yang menunggu untuk dikirim.';
      return `
        <div class="sync-center-summary ${queue.length ? (offline ? 'offline' : 'pending') : 'ok'}">

    function openSyncCenter() {

        <div class="modal-body sync-center-body">${syncCenterBodyHtml()}</div>

    function renderSyncCenterState() {
      const body = document.querySelector('.sync-center-body');

    async function startManualSync() {
      if (state.user?.role !== 'BENDAHARA') return;
      if (!navigator.onLine) {
        renderSyncCenterState();
        return;
      }
      await syncPaymentQueue({manual:true, perItemToasts:true, suppressSummaryToast:true});
      renderSyncCenterState();
    }

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function syncPaymentQueue({manual=false, perItemToasts=false, suppressSummaryToast=false}={}) {
      if (state.user?.role !== 'BENDAHARA' || !state.token) return {synced:0,confirmed:[],failed:[],attempted:0};
      if (state.syncPromise) return state.syncPromise;

      state.syncPromise = (async () => {
        const queue = getPaymentQueue();
        if (!queue.length) {
          updateSyncIndicator();
          if (manual) renderSyncCenterState();
          return {synced:0,confirmed:[],failed:[],attempted:0};
        }
        if (!navigator.onLine) {
          updateSyncIndicator();
          if (manual) renderSyncCenterState();
          return {synced:0,confirmed:[],failed:queue.map(x=>({clientId:x.clientId,message:'Menunggu koneksi.'})),attempted:0};
        }

        state.syncing = true;
        updateSyncIndicator();
        renderSyncCenterState();

        let synced = 0;
        const confirmed = [];
        const failed = [];
        try {
          const batch = await api('addPaymentsBatch', {
            token: state.token,
            items: queue.map(item => ({
              idSiswa:item.idSiswa, bulan:item.bulan, tahun:item.tahun,
              tanggalPembayaran:item.tanggalPembayaran, clientTransactionId:item.clientId
            }))
          }, {silent:true, timeout:18000});
          const results = Array.isArray(batch?.results) ? batch.results : [];

          for (const result of results) {
            const clientId = result?.clientId || '';
            if (result?.ok && result.transaction) {
              const queuedItem = getPaymentQueue().find(x => x.clientId === clientId) || queue.find(x => x.clientId === clientId);
              removeQueueItem(clientId);
              synced++;
              confirmed.push({clientId, transaction:result.transaction});
              applyServerPaymentLocally(result.transaction, true);
              renderSyncCenterState();
              if (perItemToasts || document.querySelector('.sync-center-body')) {
                const tx = result.transaction;
                toast(`${tx.student.nama} • ${titleCase(tx.bulan)} ${tx.tahun} berhasil terkirim.`, 'success', 'Sinkronisasi berhasil', 3400);
                await delay(120);
              }
            } else if (clientId) {
              const message = result?.message || 'Pembayaran belum tersinkron.';
              updateQueueFailure(clientId, message);
              failed.push({clientId,message});
              renderSyncCenterState();
            }
          }
          if (confirmed.length) finalizeLocalPaymentState();
        } catch (err) {
          getPaymentQueue().forEach(item => {
            updateQueueFailure(item.clientId, err?.message || 'Pembayaran belum tersinkron.');
            failed.push({clientId:item.clientId,message:err?.message || 'Pembayaran belum tersinkron.'});
          });
          renderSyncCenterState();
          if (isSessionError(err?.message)) toast(err.message, 'error');
          else if (manual && isNetworkLikeError(err)) toast('Pembayaran belum tersinkron. Data tetap aman di perangkat.', 'warning', 'Sinkronisasi belum selesai');
        } finally {
          state.syncing = false;
          updateSyncIndicator();
          renderSyncCenterState();
        }

        if (!suppressSummaryToast && !perItemToasts && !document.querySelector('.sync-center-body')) {
          if (confirmed.length === 1) {
            const tx = confirmed[0].transaction;
            toast(`Pembayaran ${tx.student.nama} • ${titleCase(tx.bulan)} ${tx.tahun} berhasil disimpan.`, 'success', 'Pembayaran tersimpan', 4300);
          } else if (confirmed.length > 1) {
            toast(`${confirmed.length} pembayaran berhasil disimpan.`, 'success', 'Pembayaran tersimpan', 4300);
          }
        }

        return {synced,confirmed,failed,attempted:queue.length};
      })();

      try {
        return await state.syncPromise;
      } finally {
        state.syncPromise = null;
      }
    }

    function applyServerPaymentLocally(tx, deferFinalize=false) {
      if (!tx?.student?.idSiswa) return;
      const key = `${tx.bulan}-${tx.tahun}`;
      if (!Array.isArray(state.payments)) state.payments = [];
      if (!state.payments.some(x => x.idTransaksi === tx.idTransaksi)) state.payments.push({
        idTransaksi:tx.idTransaksi, idSiswa:tx.student.idSiswa, bulan:tx.bulan, tahun:Number(tx.tahun),
        nominal:Number(tx.nominal||state.config.amount||50000), tanggalBayar:tx.tanggalBayar, status:'LUNAS'
      });
      const listStudent = state.students.find(s=>s.idSiswa===tx.student.idSiswa);
      if (listStudent) {
        listStudent.kelas = normalizeClassLabel(listStudent.kelas);
        if (!Array.isArray(listStudent.paidPeriods)) listStudent.paidPeriods=[];
        if (!listStudent.paidPeriods.includes(key)) listStudent.paidPeriods.push(key);
        listStudent.paidMonths = listStudent.paidPeriods.length;
        listStudent.unpaidMonths = Math.max(0,(state.config.periods||[]).length-listStudent.paidMonths);
      }
      state.detailCache[tx.student.idSiswa] = buildLocalStudentDetail(tx.student.idSiswa);
      if (state.selectedStudentDetail?.student?.idSiswa === tx.student.idSiswa) state.selectedStudentDetail = state.detailCache[tx.student.idSiswa];
      if (!deferFinalize) finalizeLocalPaymentState();
    }

      state.summary=local;
      state.dashboard={user:state.user,scope:local.scope,stats:summaryStatsFromSummary(local.summary),config:state.config};

    function updateLoginVisualViewport() {
      const vv = window.visualViewport;
      if (!vv) return;
      const root = document.documentElement;
      const visibleHeight = Math.max(240, Math.round(vv.height));
      const keyboardGap = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      root.style.setProperty('--login-vvh', `${visibleHeight}px`);
      root.style.setProperty('--login-keyboard-gap', `${keyboardGap}px`);

      if (!state.loginSheetOpen) return;
      const active = document.activeElement;
      if (active && active.closest?.('.login-panel') && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)) {
        window.requestAnimationFrame(() => {
          try { active.scrollIntoView({block:'center', inline:'nearest', behavior:'smooth'}); } catch (_) {}
        });
      }
    }

    function installLoginViewportHandling() {
      if (window.__komiteLoginViewportInstalled) return;
      window.__komiteLoginViewportInstalled = true;
      const vv = window.visualViewport;
      vv?.addEventListener('resize', updateLoginVisualViewport, {passive:true});
      vv?.addEventListener('scroll', updateLoginVisualViewport, {passive:true});
      window.addEventListener('orientationchange', () => setTimeout(updateLoginVisualViewport, 120), {passive:true});
      document.addEventListener('focusin', (event) => {
        if (!event.target.closest?.('.login-panel')) return;
        setTimeout(updateLoginVisualViewport, 80);
        setTimeout(() => {
          try { event.target.scrollIntoView({block:'center', inline:'nearest', behavior:'smooth'}); } catch (_) {}
        }, 180);
      });
      document.addEventListener('focusout', (event) => {
        if (!event.target.closest?.('.login-panel')) return;
        setTimeout(updateLoginVisualViewport, 120);
      });
    }

    function formatNaturalList(items) {
      const list = (items || []).filter(Boolean);
      if (!list.length) return '';
      if (list.length === 1) return list[0];
      if (list.length === 2) return `${list[0]} dan ${list[1]}`;
      return `${list.slice(0,-1).join(', ')}, dan ${list[list.length-1]}`;
    }

    function roleNotificationData() {
      const role = state.user?.role || '';
      const periods = state.config.periods || [];
      const duePeriods = periods.filter(isPeriodDueLocal);
      const latestDue = duePeriods[duePeriods.length - 1] || state.config.currentPeriod || periods[0];

      if (role === 'SISWA') {
        const d = state.selectedStudentDetail;
        if (!d?.periods) return {role, badge:0, type:'success', title:'Terima kasih!', latestDue, unpaid:[], futurePaid:[]};
        const unpaid = d.periods.filter(p => p.status === 'BELUM_BAYAR');
        const futurePaid = d.periods.filter(p => p.status === 'LUNAS' && !isPeriodDueLocal(p));
        return {role, badge:unpaid.length, type:unpaid.length ? 'warning' : 'success', title:unpaid.length ? 'Pembayaran perlu diperhatikan' : 'Terima kasih!', latestDue, unpaid, futurePaid};
      }

      if (role === 'WALI') {
        const kelas = normalizeClassLabel(state.user?.kelas || '');
        const students = (state.students || []).filter(s => !kelas || normalizeClassLabel(s.kelas) === kelas);
        const pendingByPeriod = duePeriods.map(p => {
          const key = `${p.bulan}-${p.tahun}`;
          const count = students.reduce((n,s) => n + (new Set(Array.isArray(s.paidPeriods) ? s.paidPeriods : []).has(key) ? 0 : 1), 0);
          return {bulan:p.bulan,tahun:p.tahun,label:p.label || `${titleCase(p.bulan)} ${p.tahun}`,count};
        }).filter(x => x.count > 0);
        return {role, badge:pendingByPeriod.length, type:pendingByPeriod.length ? 'warning' : 'success', title:pendingByPeriod.length ? 'Pembayaran perlu diperhatikan' : 'Terima kasih!', latestDue, pendingByPeriod, totalStudents:students.length};
      }
      return {role, badge:0};
    }

    function notificationButtonHtml() {
      const role = state.user?.role || '';
      if (!['SISWA','WALI'].includes(role)) return '';
      const n = roleNotificationData();
      return `<button class="icon-btn notification-btn" onclick="showRoleNotification()" title="Notifikasi" aria-label="Notifikasi">${icon('bell')}${n.badge ? `<span class="notification-badge">${Math.min(99,n.badge)}</span>` : ''}</button>`;
    }

    function showRoleNotification() {
      const n = roleNotificationData();
      if (!['SISWA','WALI'].includes(n.role)) return;
      const success = n.type === 'success';
      let body = '';
      if (n.role === 'SISWA') {
        if (success) {
          const dueLabel = n.latestDue?.label || `${titleCase(n.latestDue?.bulan || '')} ${n.latestDue?.tahun || ''}`.trim();
          const future = (n.futurePaid || []).map(p => `${titleCase(p.bulan)} ${p.tahun}`);
          body = `<p>Pembayaran Komite hingga <strong>${escapeHtml(dueLabel)}</strong> telah lunas.</p>${future.length ? `<div class="notice-extra">Pembayaran Komite untuk <strong>${escapeHtml(formatNaturalList(future))}</strong> juga telah lunas lebih awal.</div>` : '<div class="notice-extra">Tidak ada pembayaran yang tertunggak.</div>'}`;
        } else {
          body = `<p>Terdapat <strong>${n.unpaid.length} bulan</strong> pembayaran Komite yang sudah jatuh tempo dan belum dibayar.</p><div class="notice-list">${n.unpaid.map(p=>`<div><span>${escapeHtml(titleCase(p.bulan))} ${p.tahun}</span><strong>Belum Bayar</strong></div>`).join('')}</div><div class="notice-extra warning">Silakan melakukan pembayaran untuk periode yang telah jatuh tempo.</div>`;
        }
      } else {
        if (success) {
          const dueLabel = n.latestDue?.label || `${titleCase(n.latestDue?.bulan || '')} ${n.latestDue?.tahun || ''}`.trim();
          body = `<p>Seluruh pembayaran siswa kelas <strong>${escapeHtml(normalizeClassLabel(state.user?.kelas || ''))}</strong> sampai <strong>${escapeHtml(dueLabel)}</strong> telah lunas.</p><div class="notice-extra">Terima kasih telah memantau pembayaran kelas.</div>`;
        } else {
          body = `<p>Masih ada pembayaran siswa yang belum lunas pada periode yang sudah jatuh tempo.</p><div class="notice-list">${n.pendingByPeriod.map(x=>`<div><span>${escapeHtml(titleCase(x.bulan))} ${x.tahun}</span><strong>${x.count} siswa belum membayar</strong></div>`).join('')}</div>`;
        }
      }
      openModal(`<div class="modal-head notification-head"><div></div><button class="icon-btn" onclick="closeModal()" aria-label="Tutup">${icon('x')}</button></div><div class="modal-body"><div class="role-notice ${success?'success':'warning'}"><div class="role-notice-mark">${icon(success?'check':'alert')}</div><h3>${escapeHtml(n.title)}</h3>${body}<button class="btn ${success?'btn-primary':'btn-warning'} role-notice-ok" onclick="closeModal()">OK</button></div></div>`, false);
    }

      const left = active.offsetLeft - 8;

      if (left < segment.scrollLeft) segment.scrollLeft = Math.max(0, left);
      else if (right > segment.scrollLeft + segment.clientWidth) segment.scrollLeft = Math.max(0, right - segment.clientWidth);

      try {
        if (state.user.role === 'BENDAHARA') await syncPaymentQueue({manual:false});
        if (!navigator.onLine) throw new Error('Tidak ada koneksi internet. Data terakhir tetap ditampilkan.');

        if (state.user.role === 'SISWA') {
          const d = await api('studentDetail', {token:state.token, force:true}, {silent:true, timeout:16000});
          state.selectedStudentDetail = d;
          state.detailCache[d.student.idSiswa] = d;
          saveStudentSnapshot(d);
          renderStudentApp(d);
        } else {
          const data = await api('staffBootstrap', Object.assign({token:state.token, force:true}, scopePayload(false)), {silent:true, timeout:20000});
          applyBootstrap(data, true);
          renderCurrentStaffView();
        }
        if (!silent) toast('Data berhasil diperbarui.', 'success', 'Data diperbarui');
      } catch (err) {
        if (!silent) toast(err.message || 'Data belum dapat diperbarui.', 'warning', 'Refresh gagal');
      } finally {
        state.refreshBusy = false;
        document.getElementById('refreshBtn')?.classList.remove('spinning');
        updateSyncIndicator();
      }
    }

    // ========================= PERIODE / REKAP =========================

    function currentScopePeriod() {
      const periods = state.config.periods || [];
      return periods[state.scopeMonthIndex] || state.config.currentPeriod || periods[0];
    }

    function setDefaultScopeFromConfig() {
      const p = state.config.currentPeriod || state.config.periods?.[0];
      const index = state.config.periods.findIndex(x => x.bulan === p?.bulan && Number(x.tahun) === Number(p?.tahun));
      state.scopeMode = 'MONTH';
      state.scopeMonthIndex = index >= 0 ? index : 0;
      state.scopeClass = '';
    }

    function scopePayload(force=false) {
      const p = currentScopePeriod();
      return {
        mode: state.scopeMode,
        bulan: p?.bulan || '',
        tahun: p?.tahun || '',
        kelas: state.user?.role === 'BENDAHARA' ? state.scopeClass : '',
        force: !!force
      };
    }

    function summaryCacheKey() {
      const p = currentScopePeriod();
      return [state.scopeMode, p?.bulan || '', p?.tahun || '', state.user?.role === 'BENDAHARA' ? state.scopeClass : state.user?.kelas || ''].join('|');
    }

    function rememberCurrentSummary() {
      if (state.summary) state.summaryCache[summaryCacheKey()] = state.summary;
    }

    function applyBootstrap(data, preserveScope=true) {
      if (!data) return;
      state.config = Object.assign({}, DEFAULT_CONFIG, data.config || state.config || {});
      state.config.classes = (state.config.classes || []).map(c=>Object.assign({},c,{nama:normalizeClassLabel(c.nama)}));
      if (Array.isArray(data.students)) state.students = data.students.map(s=>Object.assign({},s,{kelas:normalizeClassLabel(s.kelas)}));
      if (Array.isArray(data.payments)) state.payments = data.payments.slice();
      state.dashboard = data.dashboard || state.dashboard;
      state.summary = data.summary || state.summary;
      state.detailCache = preserveScope ? state.detailCache : {};
      state.summaryCache = preserveScope ? state.summaryCache : {};
      if (state.user?.kelas) state.user.kelas = normalizeClassLabel(state.user.kelas);

      const scope = data.summary?.scope || data.dashboard?.scope;
      if (scope && !preserveScope) {
        state.scopeMode = scope.mode || 'MONTH';
        const anchor = scope.anchor || scope.periods?.[0];
        const idx = state.config.periods.findIndex(p => p.bulan === anchor?.bulan && Number(p.tahun) === Number(anchor?.tahun));
        if (idx >= 0) state.scopeMonthIndex = idx;
      } else if (!scope && !preserveScope) setDefaultScopeFromConfig();
      if (state.user?.role === 'BENDAHARA' && !preserveScope) state.scopeClass = data.summary?.kelas === 'SEMUA' ? '' : normalizeClassLabel(data.summary?.kelas || '');
      if (state.students.length) {
        const local = buildLocalSummaryData();
        state.summary = local;
        state.dashboard = {user:state.user,scope:local.scope,stats:summaryStatsFromSummary(local.summary),config:state.config};
      }
      rememberCurrentSummary();
      saveStaffSnapshot();
    }

    function periodRowHtml() {
      const p = currentScopePeriod();
      const isMonth = state.scopeMode === 'MONTH';
      const isB = state.user?.role === 'BENDAHARA';
      const scopeLabel = localScopeDefinition().label;
      return `${isMonth ? `<div class="period-nav"><button class="period-arrow" onclick="moveScopeMonth(-1)" ${state.scopeMonthIndex<=0?'disabled':''} aria-label="Bulan sebelumnya">${icon('left')}</button><div class="period-label">${escapeHtml(p?.label || '')}</div><button class="period-arrow" onclick="moveScopeMonth(1)" ${state.scopeMonthIndex>=state.config.periods.length-1?'disabled':''} aria-label="Bulan berikutnya">${icon('right')}</button></div>` : `<div class="period-static">${escapeHtml(scopeLabel)}</div>`}
        ${isB ? `<div class="select-badge-wrap"><select class="select period-class" onchange="changeScopeClass(this.value)"><option value="" ${!state.scopeClass?'selected':''}>Semua Kelas</option>${state.config.classes.map(c=>`<option value="${escapeHtml(c.nama)}" ${normalizeClassLabel(state.scopeClass)===normalizeClassLabel(c.nama)?'selected':''}>Kelas ${escapeHtml(normalizeClassLabel(c.nama))}</option>`).join('')}</select><span class="select-arrow-badge">${icon('down')}</span></div>` : `<div class="period-class-readonly">Kelas ${escapeHtml(normalizeClassLabel(state.user?.kelas || ''))}</div>`}`;
    }

    function periodControlsHtml(collapsible=false) {
      const modes = [['MONTH','Bulan'],['SEM1','Semester 1'],['SEM2','Semester 2'],['YEAR','Tahun Ajaran']];
      return `<section class="period-panel ${collapsible && !state.filterOpen ? 'hidden' : ''}" id="periodPanel">
        <div class="period-segment">${modes.map(([mode,label])=>`<button data-key="${mode}" class="${state.scopeMode===mode?'active':''}" onclick="changeScopeMode('${mode}')">${label}</button>`).join('')}</div>
        <div class="period-row">${periodRowHtml()}</div>
      </section>`;
    }

    function togglePeriodFilter() {
      state.filterOpen = !state.filterOpen;
      const panel = document.getElementById('periodPanel');
      if (panel) panel.classList.toggle('hidden', !state.filterOpen);
      const btn = document.getElementById('dashboardFilterToggle');
      if (btn) {
        btn.innerHTML = icon(state.filterOpen ? 'up' : 'filter');
        btn.setAttribute('aria-expanded', String(state.filterOpen));
        btn.setAttribute('title', state.filterOpen ? 'Sembunyikan filter' : 'Tampilkan filter');
        btn.setAttribute('aria-label', state.filterOpen ? 'Sembunyikan filter' : 'Tampilkan filter');
      }
      if (state.filterOpen) requestAnimationFrame(ensureActivePeriodVisible);
    }

    function changeScopeMode(mode) {
      if (!['MONTH','SEM1','SEM2','YEAR'].includes(mode) || mode === state.scopeMode) return;
      state.scopeMode = mode;
      loadScopeSummary();
    }

    function moveScopeMonth(delta) {
      if (state.scopeMode !== 'MONTH') return;
      const next = Math.max(0, Math.min(state.config.periods.length - 1, state.scopeMonthIndex + Number(delta || 0)));
      if (next === state.scopeMonthIndex) return;
      state.scopeMonthIndex = next;
      loadScopeSummary();
    }

    function changeScopeClass(value) {
      if (state.user?.role !== 'BENDAHARA') return;
      state.scopeClass = normalizeClassLabel(value || '');
      loadScopeSummary();
    }

    function localScopeDefinition() {
      const periods = state.config.periods || [];
      if (state.scopeMode === 'SEM1') return {mode:'SEM1',label:'Semester 1',periods:periods.slice(0,6),anchor:periods[0]};
      if (state.scopeMode === 'SEM2') return {mode:'SEM2',label:'Semester 2',periods:periods.slice(6,12),anchor:periods[6]};
      if (state.scopeMode === 'YEAR') return {mode:'YEAR',label:`Tahun Ajaran ${state.config.schoolYear}`,periods:periods.slice(),anchor:periods[0]};
      const p = currentScopePeriod();
      return {mode:'MONTH',label:p?.label || '',periods:p?[p]:[],anchor:p};
    }

    function isPeriodDueLocal(period) {
      const periods = state.config.periods || [];
      const current = state.config.currentPeriod;
      const currentIndex = periods.findIndex(p=>p.bulan===current?.bulan && Number(p.tahun)===Number(current?.tahun));
      const idx = periods.findIndex(p=>p.bulan===period?.bulan && Number(p.tahun)===Number(period?.tahun));
      if (currentIndex < 0 || idx < 0) return false;
      return idx <= currentIndex;
    }

    function buildLocalSummaryData() {
      const scope = localScopeDefinition();
      const selectedClass = state.user?.role === 'BENDAHARA' ? normalizeClassLabel(state.scopeClass) : normalizeClassLabel(state.user?.kelas || '');
      const students = (state.students || []).filter(s => !selectedClass || normalizeClassLabel(s.kelas) === selectedClass);
      const selectedPeriods = scope.periods || [];
      const amount = Number(state.config.amount || 50000);
      let paidSlots=0, unpaidDueSlots=0, futureSlots=0, fullyPaidStudents=0;
      const list = students.map(s => {
        const paidSet = new Set(Array.isArray(s.paidPeriods) ? s.paidPeriods : []);
        let paidCount=0, paidDueCount=0;
        const duePeriods = selectedPeriods.filter(isPeriodDueLocal);
        selectedPeriods.forEach(p=>{
          const key=`${p.bulan}-${p.tahun}`;
          if (paidSet.has(key)) {
            paidCount++;
            if (isPeriodDueLocal(p)) paidDueCount++;
          }
        });
        const dueCount=duePeriods.length;
        const unpaidDue=Math.max(0,dueCount-paidDueCount);
        const futureUnpaid=Math.max(0,selectedPeriods.length-dueCount-(paidCount-paidDueCount));
        paidSlots+=paidCount; unpaidDueSlots+=unpaidDue; futureSlots+=futureUnpaid;
        if (selectedPeriods.length && paidCount===selectedPeriods.length) fullyPaidStudents++;
        let status='BELUM_JATUH_TEMPO';
        if (selectedPeriods.length && paidCount===selectedPeriods.length) status='LUNAS';
        else if (unpaidDue>0) status='BELUM_BAYAR';
        else if (paidCount>0) status='SEBAGIAN';
        return {idSiswa:s.idSiswa,nisn:s.nisn,nama:s.nama,kelas:normalizeClassLabel(s.kelas),paidMonths:paidCount,totalMonths:selectedPeriods.length,unpaidDueMonths:unpaidDue,futureMonths:futureUnpaid,paidAmount:paidCount*amount,status};
      }).sort((a,b)=>a.nama.localeCompare(b.nama,'id'));
      const totalSlots=students.length*selectedPeriods.length;
      return {scope,kelas:selectedClass||'SEMUA',summary:{totalStudents:students.length,totalSlots,paid:paidSlots,unpaid:unpaidDueSlots,future:futureSlots,fullyPaidStudents,percentage:totalSlots?Math.round(paidSlots/totalSlots*100):0,totalAmount:paidSlots*amount,students:list}};
    }

    function loadScopeSummary() {
      const data = buildLocalSummaryData();
      state.summary = data;
      state.dashboard = {user:state.user, scope:data.scope, stats:summaryStatsFromSummary(data.summary), config:state.config};
      state.summaryCache[summaryCacheKey()] = data;
      saveStaffSnapshot();
      renderCurrentStaffView();
    }

    function summaryStatsFromSummary(s) {
      return {totalStudents:s?.totalStudents||0,totalSlots:s?.totalSlots||0,paid:s?.paid||0,unpaid:s?.unpaid||0,future:s?.future||0,fullyPaidStudents:s?.fullyPaidStudents||0,percentage:s?.percentage||0,totalAmount:s?.totalAmount||0};
    }

    function scopeIsMonth() { return state.scopeMode === 'MONTH'; }

    function renderHomeContent() {
      const d = state.dashboard;
      const s = d?.stats || summaryStatsFromSummary(state.summary?.summary);
      const isB = state.user?.role === 'BENDAHARA';
      const label = d?.scope?.label || state.summary?.scope?.label || currentScopePeriod()?.label || '';
      const periodCount = state.summary?.scope?.periods?.length || d?.scope?.periods?.length || 1;
      const paidLabel = scopeIsMonth() ? 'Lunas' : 'Pembayaran Lunas';
      return `
        <section class="hero dashboard-hero">
          <button id="dashboardFilterToggle" class="hero-filter-toggle" onclick="togglePeriodFilter()" title="${state.filterOpen ? 'Sembunyikan filter' : 'Tampilkan filter'}" aria-label="${state.filterOpen ? 'Sembunyikan filter' : 'Tampilkan filter'}" aria-expanded="${state.filterOpen}">${icon(state.filterOpen ? 'up' : 'filter')}</button>
          <div class="hero-kicker">${isB ? 'Dashboard Bendahara' : 'Dashboard Wali Kelas • '+escapeHtml(normalizeClassLabel(state.user.kelas || ''))}</div>
          <div class="hero-user-name">${escapeHtml(state.user?.nama || '')}</div>
          <div class="hero-title">${escapeHtml(label)}</div>
          <div class="hero-sub">Status Pembayaran Komite • ${money(state.config.amount)} per siswa${Number(s.future||0)>0 ? ` • ${s.future} belum jatuh tempo` : ''}</div>
          <div class="hero-stats">
            <div class="hero-stat"><small>Siswa</small><strong>${s.totalStudents||0}</strong></div>
            <div class="hero-stat"><small>${paidLabel}</small><strong>${s.paid||0}${periodCount>1?`/${s.totalSlots||0}`:''}</strong></div>
            <div class="hero-stat"><small>Belum</small><strong>${s.unpaid||0}</strong></div>
          </div>
        </section>
        ${periodControlsHtml(true)}
        ${isB ? `
          <div class="section-head"><div><h2>Akses cepat</h2><p>Fitur utama untuk pencatatan dan pemantauan Komite.</p></div></div>
          <div class="action-grid has-four">
            <button class="action-card primary" onclick="openPaymentSearch()"><span class="action-icon">${icon('plus')}</span><strong>Catat Pembayaran</strong><span class="action-desc">Cari siswa dan pilih bulan</span></button>
            <button class="action-card" onclick="navigate('students')"><span class="action-icon">${icon('users')}</span><strong>Data Siswa</strong><span class="action-desc">Lihat status pembayaran</span></button>
            <button class="action-card" onclick="navigate('summary')"><span class="action-icon">${icon('chart')}</span><strong>Rekap</strong><span class="action-desc">Bulan, semester, tahun ajaran</span></button>
            <button class="action-card" onclick="openSemesterRecapDialog()"><span class="action-icon">${icon('printer')}</span><strong>Cetak Rekap Semester</strong><span class="action-desc">Preview rekap satu kelas</span></button>
          </div>
        ` : `
          <div class="section-head wali-student-heading"><div><h2>Siswa Kelas ${escapeHtml(normalizeClassLabel(state.user.kelas || ''))}</h2><p>${escapeHtml(label)} • seluruh siswa pada periode yang dipilih.</p></div><button class="icon-btn wali-recap-inline-btn" onclick="openSemesterRecapDialog()" title="Cetak Rekap Semester" aria-label="Cetak Rekap Semester">${icon('printer')}</button></div>
          <div class="card card-pad">${summaryStudentsHtml(state.summary?.summary?.students || [], false)}</div>
        `}`;
    }

    async function navigate(view) {
      if (state.user?.role === 'WALI') {
        state.currentView = 'home';
        renderStaffShell();
        return;
      }
      state.currentView = view;
      if (view === 'home') { renderStaffShell(); return; }
      if (view === 'students') { renderStudentsView(); return; }
      if (view === 'summary' && state.user?.role === 'BENDAHARA') { renderSummaryView(); return; }
    }

    // ========================= DATA SISWA =========================

    function renderStudentsView() {
      const canClass = state.user.role === 'BENDAHARA';
      const html = `
        <div class="section-head"><div><h2>${canClass?'Data Siswa':'Murid '+escapeHtml(normalizeClassLabel(state.user.kelas))}</h2><p>${state.students.length} data aktif</p></div>${canClass?`<button class="btn btn-primary btn-sm" onclick="openPaymentSearch()">${icon('plus')} Catat Pembayaran</button>`:''}</div>
        <section class="card card-pad">
          <div class="toolbar ${canClass?'three':''}">
            <div class="field-wrap"><span class="field-icon">${icon('search')}</span><input id="studentSearch" class="input" placeholder="Cari nama atau NISN" oninput="filterStudentsView()"></div>
            ${canClass ? `<div class="select-badge-wrap"><select id="studentClass" class="select" onchange="filterStudentsView()"><option value="">Semua kelas</option>${state.config.classes.map(c=>`<option value="${escapeHtml(c.nama)}">Kelas ${escapeHtml(normalizeClassLabel(c.nama))}</option>`).join('')}</select><span class="select-arrow-badge">${icon('down')}</span></div>` : ''}
            <div></div>
          </div>
          <div id="studentList" class="student-list"></div>
        </section>`;
      renderStaffShell(html);
      filterStudentsView();
    }

    function studentRowHtml(s, paymentMode=false) {
      return `<button class="student-row" onclick="openStudentDetail('${escapeHtml(s.idSiswa)}', ${paymentMode})">
        <span class="avatar">${escapeHtml(initials(s.nama).toUpperCase())}</span>
        <span class="student-main"><strong>${escapeHtml(s.nama)}</strong><span class="student-meta"><span>${escapeHtml(normalizeClassLabel(s.kelas))}</span><span>•</span><span>NISN ${escapeHtml(s.nisn)}</span>${Number.isFinite(s.paidMonths)?`<span>•</span><span>${s.paidMonths}/12 lunas</span>`:''}</span></span>
        <span class="chev">${icon('chevron')}</span>
      </button>`;
    }

    function filterStudentsView() {
      const q = (document.getElementById('studentSearch')?.value || '').toLowerCase().trim();
      const k = document.getElementById('studentClass')?.value || '';
      const list = state.students.filter(s => (!q || s.nama.toLowerCase().includes(q) || s.nisn.toLowerCase().includes(q)) && (!k || s.kelas===k));
      const target = document.getElementById('studentList');
      if (target) target.innerHTML = list.length ? list.map(studentRowHtml).join('') : emptyHtml('Siswa tidak ditemukan','Coba kata pencarian atau kelas yang lain.');
    }

    // ========================= CATAT PEMBAYARAN =========================

    function openPaymentSearch() {
      state.paymentSelection = [];
      state.paymentSelectionStudent = '';
      state.paymentDate = todayJayapuraIso();
      if (!state.students.length) {
        toast('Data siswa belum tersedia. Tekan Refresh untuk mengambil data terbaru.', 'warning');
        return;
      }
      openModal(`
        <div class="modal-head"><div><h3>Catat Pembayaran</h3><p>Cari siswa, lalu pilih bulan Pembayaran Komite.</p></div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
        <div class="modal-body">
          ${queueCount()?`<div class="sync-notice">${icon('clock')} <span><strong>${queueCount()} pembayaran menunggu sinkronisasi.</strong> Anda tetap dapat mencatat pembayaran berikutnya.</span></div>`:''}
          <div class="toolbar three">
            <div class="field-wrap"><span class="field-icon">${icon('search')}</span><input id="paySearch" class="input" placeholder="Cari nama atau NISN" oninput="filterPaymentStudents()" autofocus></div>
            <div class="select-badge-wrap"><select id="payClass" class="select" onchange="filterPaymentStudents()"><option value="">Semua kelas</option>${state.config.classes.map(c=>`<option value="${escapeHtml(c.nama)}">Kelas ${escapeHtml(normalizeClassLabel(c.nama))}</option>`).join('')}</select><span class="select-arrow-badge">${icon('down')}</span></div>
            <div></div>
          </div>
          <div id="payStudentList" class="student-list"></div>
        </div>`, true);
      filterPaymentStudents();
      setTimeout(()=>document.getElementById('paySearch')?.focus(),50);
    }

    function filterPaymentStudents() {
      const q = (document.getElementById('paySearch')?.value || '').toLowerCase().trim();
      const k = document.getElementById('payClass')?.value || '';
      const list = state.students.filter(s => (!q || s.nama.toLowerCase().includes(q) || s.nisn.toLowerCase().includes(q)) && (!k || s.kelas===k)).slice(0,100);
      const target = document.getElementById('payStudentList');
      if (target) target.innerHTML = list.length ? list.map(s=>studentRowHtml(s,true)).join('') : emptyHtml('Siswa tidak ditemukan','Periksa nama, NISN, atau kelas.');
    }

    function openStudentDetail(idSiswa, paymentMode=false) {
      try {
        const d = buildLocalStudentDetail(idSiswa) || state.detailCache[idSiswa];
        if (!d) throw new Error('Data siswa belum tersedia. Tekan Refresh lalu coba lagi.');
        state.detailCache[idSiswa] = d;
        state.selectedStudentDetail = d;
        const isB = state.user.role === 'BENDAHARA';
        openModal(studentDetailModalHtml(d, paymentMode && isB), true);
      } catch (err) { toast(err.message,'error'); }
    }

    function buildLocalStudentDetail(idSiswa) {
      const s = state.students.find(x => x.idSiswa === idSiswa);
      if (!s) return null;
      const serverPayments = (state.payments || []).filter(x => x.idSiswa === idSiswa && String(x.status || 'LUNAS').toUpperCase() === 'LUNAS');
      const paymentMap = new Map(serverPayments.map(x => [`${x.bulan}-${x.tahun}`, x]));
      const paidSet = new Set(Array.isArray(s.paidPeriods) ? s.paidPeriods : []);
      serverPayments.forEach(x => paidSet.add(`${x.bulan}-${x.tahun}`));
      const pending = getPaymentQueue().filter(x => x.idSiswa === idSiswa);
      const pendingSet = new Set(pending.map(x => `${x.bulan}-${x.tahun}`));
      const current = state.config.currentPeriod;
      const currentIndex = state.config.periods.findIndex(p => p.bulan === current?.bulan && Number(p.tahun) === Number(current?.tahun));
      const periods = state.config.periods.map((p, index) => {
        const key = `${p.bulan}-${p.tahun}`;
        const tx = paymentMap.get(key);
        const paid = paidSet.has(key);
        return {
          bulan:p.bulan, tahun:p.tahun, label:p.label,
          status: paid ? 'LUNAS' : (currentIndex >= 0 && index <= currentIndex ? 'BELUM_BAYAR' : 'BELUM_JATUH_TEMPO'),
          nominal:Number(tx?.nominal || state.config.amount || 50000), idTransaksi:tx?.idTransaksi || '', pending:pendingSet.has(key)
        };
      });
      const history = serverPayments.map(x => ({
        idTransaksi:x.idTransaksi || '', bulan:String(x.bulan || '').toUpperCase(), tahun:Number(x.tahun),
        nominal:Number(x.nominal || state.config.amount || 50000), tanggalBayar:x.tanggalBayar || '', status:'LUNAS'
      })).sort((a,b) => {
        const ai=state.config.periods.findIndex(p=>p.bulan===a.bulan&&Number(p.tahun)===Number(a.tahun));
        const bi=state.config.periods.findIndex(p=>p.bulan===b.bulan&&Number(p.tahun)===Number(b.tahun));
        return bi-ai;
      });
      const paidMonths=periods.filter(p=>p.status==='LUNAS').length;
      return {
        student:{idSiswa:s.idSiswa,nisn:s.nisn,nama:s.nama,kelas:s.kelas},
        paidMonths, totalMonths:periods.length,
        paidAmount:history.length ? history.reduce((sum,h)=>sum+Number(h.nominal||0),0) : paidMonths * Number(state.config.amount||50000),
        periods, history, localData:true
      };
    }

    function studentDetailModalHtml(d, paymentMode) {
      const s = d.student;
      const pending = getPaymentQueue().filter(x=>x.idSiswa===s.idSiswa).length;
      if (paymentMode && state.paymentSelectionStudent !== s.idSiswa) {
        state.paymentSelectionStudent = s.idSiswa;
        state.paymentSelection = [];
        state.paymentDate = todayJayapuraIso();
      }
      return `
        <div class="modal-head"><div><h3>${escapeHtml(s.nama)}</h3><p>${escapeHtml(normalizeClassLabel(s.kelas))} • NISN ${escapeHtml(s.nisn)} • ${d.paidMonths}/12 bulan lunas${pending?` • ${pending} menunggu sinkron`:''}</p></div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
        <div class="modal-body">
          <div class="section-head" style="margin-top:0"><div><h2>Pembayaran ${escapeHtml(state.config.schoolYear)}</h2><p>${paymentMode?'Pilih satu atau beberapa bulan yang akan dicatat.':'Status Pembayaran Komite per bulan.'}</p></div><span class="status-pill ok">${icon('check')} ${money(d.paidAmount)}</span></div>
          <div class="months-grid">${d.periods.map(p=>monthCardHtml(p, s.idSiswa, paymentMode)).join('')}</div>
          ${paymentMode ? paymentSelectionPanelHtml(s.idSiswa) : ''}
          <div class="section-head history-heading-actions"><div><h2>Riwayat Pembayaran</h2><p>${d.history.length ? d.history.length+' transaksi lunas' : 'Belum ada transaksi'}</p></div>${!paymentMode && ['BENDAHARA','WALI'].includes(state.user.role) ? `<button class="btn btn-soft btn-sm print-card-btn" onclick="previewStudentCard('${escapeHtml(s.idSiswa)}')" title="Cetak Kartu Komite">${icon('printer')}<span class="print-card-label">Cetak Kartu Komite</span></button>` : ''}</div>
          <div class="card card-pad">${historyHtml(d.history, state.user.role === 'BENDAHARA')}</div>
        </div>`;
    }

    function monthCardHtml(p, idSiswa, paymentMode=false) {
      const pending = pendingPayment(idSiswa, p.bulan, p.tahun);
      const lunas = p.status === 'LUNAS';
      const due = p.status === 'BELUM_BAYAR';
      const key = `${p.bulan}-${p.tahun}`;
      const selected = paymentMode && state.paymentSelection.includes(key);
      const status = pending
        ? `<span class="status-pill sync">${icon('clock')} Menunggu sinkron</span>`
        : lunas
          ? `<span class="status-pill ok">${icon('check')} Lunas</span>`
          : selected ? `<span class="status-pill selected">${icon('check')} Dipilih</span>`
          : due ? `<span class="status-pill wait">${icon('clock')} Belum Bayar</span>`
          : `<span class="status-pill future">${icon('calendar')} Belum Jatuh Tempo</span>`;
      const selectable = paymentMode && !lunas && !pending;
      return `<div class="month-card ${lunas?'lunas':''} ${selectable?'selectable':''} ${selected?'selected':''}" ${selectable?`data-pay-key="${escapeHtml(key)}" onclick="togglePaymentMonth('${escapeHtml(idSiswa)}','${escapeHtml(p.bulan)}',${p.tahun})"`:''}>
        <div><div class="month-name">${escapeHtml(titleCase(p.bulan))}</div><div class="month-year">${p.tahun}</div></div>${status}
      </div>`;
    }

    function historyHtml(history, allowCancel=false) {
      if (!history.length) return emptyHtml('Belum ada pembayaran','Pembayaran yang telah tercatat akan muncul di sini.');
      return `<div class="history-list">${history.map(h=>`
        <div class="history-row">
          <div><strong>${titleCase(h.bulan)} ${h.tahun}</strong><div class="meta">${escapeHtml(h.tanggalBayar)}</div></div>
          <div class="history-amount"><strong>${money(h.nominal)}</strong><div style="margin-top:6px;display:flex;justify-content:flex-end;gap:6px"><span class="status-pill ok">${icon('check')} Lunas</span>${allowCancel?`<button class="btn btn-soft btn-sm" title="Cetak bukti" onclick="printHistoryReceipt('${escapeHtml(h.idTransaksi)}')">${icon('printer')}</button><button class="btn btn-danger btn-sm" title="Batalkan" onclick="confirmCancel('${escapeHtml(h.idTransaksi)}')">${icon('trash')}</button>`:''}</div></div>
        </div>`).join('')}</div>`;
    }

    function paymentSelectionPanelHtml(idSiswa) {
      const count = state.paymentSelection.length;
      return `<div class="payment-selection" id="paymentSelectionPanel">
        <div class="payment-selection-summary"><strong id="paymentSelectionCount">${count ? count+' bulan dipilih' : 'Belum ada bulan dipilih'}</strong><span id="paymentSelectionTotal">${count ? money(count*Number(state.config.amount||50000)) : 'Pilih bulan yang belum lunas'}</span></div>
        <div class="payment-date-wrap"><label class="label" for="paymentDate">Tanggal Pembayaran</label><input id="paymentDate" class="input" type="date" max="${todayJayapuraIso()}" value="${escapeHtml(state.paymentDate || todayJayapuraIso())}" oninput="validatePaymentDateInput(this)" onchange="validatePaymentDateInput(this)"></div>
        <button id="saveSelectedPaymentBtn" class="btn btn-primary" ${count?'':'disabled'} onclick="saveSelectedPayments('${escapeHtml(idSiswa)}')">${icon('check')} Simpan</button>
      </div>`;
    }

    function validatePaymentDateInput(input) {
      if (!input) return true;
      const today = todayJayapuraIso();
      input.max = today;
      if (input.value && input.value > today) {
        input.value = today;
        state.paymentDate = today;
        toast('Tanggal pembayaran tidak boleh melebihi hari ini.', 'warning');
        return false;
      }
      state.paymentDate = input.value || today;
      return true;
    }

    function togglePaymentMonth(idSiswa, bulan, tahun) {
      if (state.paymentSelectionStudent !== idSiswa) return;
      const key = `${bulan}-${tahun}`;
      const i = state.paymentSelection.indexOf(key);
      if (i >= 0) state.paymentSelection.splice(i,1); else state.paymentSelection.push(key);
      const card = document.querySelector(`[data-pay-key="${CSS.escape(key)}"]`);
      if (card) {
        card.classList.toggle('selected', state.paymentSelection.includes(key));
        const pill = card.querySelector('.status-pill');
        if (pill) pill.outerHTML = state.paymentSelection.includes(key) ? `<span class="status-pill selected">${icon('check')} Dipilih</span>` : `<span class="status-pill ${isPeriodDueLocal({bulan,tahun})?'wait':'future'}">${icon(isPeriodDueLocal({bulan,tahun})?'clock':'calendar')} ${isPeriodDueLocal({bulan,tahun})?'Belum Bayar':'Belum Jatuh Tempo'}</span>`;
      }
      updatePaymentSelectionPanel();
    }

    function updatePaymentSelectionPanel() {
      const count=state.paymentSelection.length;
      const countEl=document.getElementById('paymentSelectionCount');
      const totalEl=document.getElementById('paymentSelectionTotal');
      const btn=document.getElementById('saveSelectedPaymentBtn');
      if (countEl) countEl.textContent=count?`${count} bulan dipilih`:'Belum ada bulan dipilih';
      if (totalEl) totalEl.textContent=count?money(count*Number(state.config.amount||50000)):'Pilih bulan yang belum lunas';
      if (btn) btn.disabled=!count;
    }

    function paymentMonthsLabel(keys) {
      return keys.map(key => {
        const [bulan,tahun] = key.split('-');
        return `${titleCase(bulan)} ${tahun}`;
      }).join(', ');
    }

              <div><span>Kelas</span><strong>${escapeHtml(normalizeClassLabel(student.kelas))}</strong></div>

    function showPaymentQueuedModal(student, selectedKeys, paymentDate) {
      const offline = !navigator.onLine;
      openModal(`
        <div class="modal-body">
          <div class="receipt payment-result">
            <div class="queued-mark">${icon(offline ? 'offline' : 'clock')}</div>
            <h3>Menunggu sinkronisasi</h3>
            <p class="payment-result-sub">Pembayaran disimpan sementara di perangkat dan belum dikonfirmasi oleh layanan aplikasi.</p>
            <div class="receipt-name">${escapeHtml(student.nama)}</div>
            <div class="receipt-details">
              <div><span>Periode</span><strong>${escapeHtml(paymentMonthsLabel(selectedKeys))}</strong></div>
              <div><span>Tanggal Pembayaran</span><strong>${escapeHtml(paymentDate)}</strong></div>
              <div><span>Status</span><strong>${queueCount()} pembayaran menunggu</strong></div>
            </div>
            <div class="payment-result-actions">
              <button class="btn btn-soft" onclick="openSyncCenter()">${icon('cloud')} Lihat Sinkronisasi</button>
              <button class="btn btn-primary" onclick="openPaymentSearch()">OK, Lanjut</button>
            </div>
          </div>
        </div>`, false);
