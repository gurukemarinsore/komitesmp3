    async function saveSelectedPayments(idSiswa) {
      const d = state.selectedStudentDetail;
      const s = d?.student;
      if (!s || s.idSiswa !== idSiswa) return;
      if (!state.paymentSelection.length) { toast('Pilih minimal satu bulan pembayaran.', 'warning'); return; }
      const paymentDate = document.getElementById('paymentDate')?.value || state.paymentDate || todayJayapuraIso();
      if (!paymentDate) { toast('Pilih tanggal pembayaran.', 'warning'); return; }
      if (paymentDate > todayJayapuraIso()) { toast('Tanggal pembayaran tidak boleh melebihi hari ini.', 'warning'); return; }

      state.paymentDate = paymentDate;
      const selectedKeys = state.paymentSelection.slice();
      const addedClientIds = [];
      let duplicates = 0;

      selectedKeys.forEach(key => {
        const [bulan,tahunText] = key.split('-');
        const result = enqueuePayment(idSiswa,bulan,Number(tahunText),s,paymentDate);
        if (result.duplicate) duplicates++;
        else addedClientIds.push(result.item.clientId);
      });

      state.paymentSelection = [];

      if (!addedClientIds.length) {
        state.paymentSelectionStudent = '';
        showPaymentQueuedModal(s, selectedKeys, paymentDate);
        return;
      }

      const saveBtn = document.getElementById('saveSelectedPaymentBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `${icon('clock')} Menyimpan…`;
      }

      if (!navigator.onLine) {
        state.paymentSelectionStudent = '';
        showPaymentQueuedModal(s, selectedKeys, paymentDate);
        return;
      }

      try {
        await syncPaymentQueue({manual:false, suppressSummaryToast:true});
        let remainingTargets = addedClientIds.filter(id => getPaymentQueue().some(x => x.clientId === id));
        if (remainingTargets.length && navigator.onLine) {
          await syncPaymentQueue({manual:false, suppressSummaryToast:true});
          remainingTargets = addedClientIds.filter(id => getPaymentQueue().some(x => x.clientId === id));
        }

        state.paymentSelectionStudent = '';
        if (!remainingTargets.length) showPaymentSuccessModal(s, selectedKeys, paymentDate);
        else showPaymentQueuedModal(s, selectedKeys, paymentDate);
      } catch (_) {
        state.paymentSelectionStudent = '';
        showPaymentQueuedModal(s, selectedKeys, paymentDate);
      }
    }

    function shortPaymentDate(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      const parts = raw.split(/[\/\-]/);
      if (parts.length >= 2) {
        const d = Number(parts[0]);
        const m = Number(parts[1]);
        if (d && m) return `${d}/${m}`;
      }
      return raw;
    }

    function printStatusLabel(status) {
      const s = String(status || '').toUpperCase();
      if (s === 'LUNAS') return 'Lunas';
      if (s === 'BELUM_BAYAR') return 'Belum Bayar';
      return 'Belum Jatuh Tempo';
    }

    function printableStudentDetail(idSiswa) {
      const current = state.selectedStudentDetail;
      if (current?.student?.idSiswa === idSiswa) return current;
      if (state.detailCache[idSiswa]) return state.detailCache[idSiswa];
      return buildLocalStudentDetail(idSiswa);
    }

    function buildStudentCardDocument(d) {

    function previewStudentCard(idSiswa) {

    function semesterPeriods(semester) {
      const periods = state.config.periods || [];
      return String(semester).toUpperCase() === 'SEM2' ? periods.slice(6,12) : periods.slice(0,6);
    }

    function openSemesterRecapDialog() {
      const isB = state.user?.role === 'BENDAHARA';
      if (!['BENDAHARA','WALI'].includes(state.user?.role || '')) return;
      const currentClass = normalizeClassLabel(isB ? (state.scopeClass || state.config.classes?.[0]?.nama || '7A') : state.user?.kelas || '');

        <div class="modal-body">
          <div class="print-dialog-grid">
            ${isB ? `<div><div class="meta" style="margin-bottom:6px">Kelas</div><div class="select-badge-wrap"><select id="semesterPrintClass" class="select period-class">${(state.config.classes||[]).map(c=>{const k=normalizeClassLabel(c.nama);return `<option value="${escapeHtml(k)}" ${k===currentClass?'selected':''}>Kelas ${escapeHtml(k)}</option>`}).join('')}</select><span class="select-arrow-badge">${icon('down')}</span></div></div>` : `<div><div class="meta" style="margin-bottom:6px">Kelas</div><div class="period-class-readonly">Kelas ${escapeHtml(currentClass)}</div><input type="hidden" id="semesterPrintClass" value="${escapeHtml(currentClass)}"></div>`}
            <div><div class="meta" style="margin-bottom:6px">Semester</div><div class="select-badge-wrap"><select id="semesterPrintTerm" class="select period-class"><option value="SEM1">Semester 1</option><option value="SEM2">Semester 2</option></select><span class="select-arrow-badge">${icon('down')}</span></div></div>

      `);
    }

    function previewSemesterRecapFromDialog() {
      const kelas = normalizeClassLabel(document.getElementById('semesterPrintClass')?.value || state.user?.kelas || '');
      const semester = document.getElementById('semesterPrintTerm')?.value || 'SEM1';
      if (!kelas) { toast('Pilih kelas terlebih dahulu.', 'warning'); return; }
      const students = (state.students || []).filter(s => normalizeClassLabel(s.kelas) === kelas);
      if (!students.length) { toast(`Data siswa Kelas ${kelas} belum tersedia.`, 'warning'); return; }
      openPrintPreview(`Rekap Semester • Kelas ${kelas}`, buildSemesterRecapDocument(kelas, semester));
    }

    function buildSemesterRecapDocument(kelas, semester) {
      const periods = semesterPeriods(semester);
      const termLabel = String(semester).toUpperCase() === 'SEM2' ? 'Semester 2' : 'Semester 1';
      const students = (state.students || [])
        .filter(s => normalizeClassLabel(s.kelas) === normalizeClassLabel(kelas))
        .slice()
        .sort((a,b)=>String(a.nama||'').localeCompare(String(b.nama||''),'id'));

      const payMap = new Map();
      (state.payments || []).forEach(p => {
        if (normalizeClassLabel(p.kelas || '') && normalizeClassLabel(p.kelas) !== normalizeClassLabel(kelas)) return;
        if (String(p.status || 'LUNAS').toUpperCase() !== 'LUNAS') return;
        payMap.set(`${p.idSiswa}|${String(p.bulan).toUpperCase()}-${Number(p.tahun)}`, p);
      });

      const monthHeads = periods.map(p=>`<th>${escapeHtml(titleCase(p.bulan))}</th>`).join('');
      const rows = students.map((s,i)=>{
        const cells = periods.map(p=>{
          const tx = payMap.get(`${s.idSiswa}|${String(p.bulan).toUpperCase()}-${Number(p.tahun)}`);
          return tx ? `<td class="center"><div class="check">✓</div><div class="paydate">${escapeHtml(shortPaymentDate(tx.tanggalBayar))}</div></td>` : `<td class="center muted">—</td>`;
        }).join('');
        return `<tr><td class="center">${i+1}</td><td><strong>${escapeHtml(s.nama)}</strong></td>${cells}</tr>`;
      }).join('');

      return `<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekap Komite ${escapeHtml(kelas)} ${termLabel}</title><style>
        ${commonPrintCss(true)}
        .doc-head{margin-bottom:3mm}
        .recap-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:3mm;font-size:7pt}
        .recap-table th,.recap-table td{padding:2px 3px;height:13px;line-height:1.05}
        .recap-table thead th{font-size:6.5pt}
        .recap-table tbody td{font-size:6.8pt}
        .recap-table th:nth-child(1),.recap-table td:nth-child(1){width:5%}
        .recap-table th:nth-child(2),.recap-table td:nth-child(2){width:35%;text-align:left}
        .recap-table th:nth-child(n+3),.recap-table td:nth-child(n+3){width:10%}
        .recap-table .check{font-size:8pt}
        .recap-table .paydate{font-size:5.5pt}
      </style></head><body>
        <main class="paper">
          <div class="doc-head"><div><div class="school">${escapeHtml(state.config.schoolName)}</div><div class="doc-title">Rekap Pembayaran Komite</div></div><span class="pill">${termLabel}</span></div>
          <div class="recap-meta"><span><strong>Kelas ${escapeHtml(normalizeClassLabel(kelas))}</strong> • Tahun Pelajaran ${escapeHtml(state.config.schoolYear)}</span><span>${escapeHtml(money(state.config.amount))} / bulan</span></div>
          <div class="table-wrap"><table class="recap-table"><thead><tr><th>No</th><th>Nama Siswa</th>${monthHeads}</tr></thead><tbody>${rows}</tbody></table></div>
          <div class="foot">✓ = lunas • angka kecil menunjukkan tanggal pembayaran (tanggal/bulan)</div>
        </main></body></html>`;
    }

    function openPrintPreview(title, documentHtml) {
      state.printDocument = { title, html:documentHtml };
      openModal(`
        <div class="modal-head"><div><h3>${escapeHtml(title)}</h3><p>Periksa hasil sebelum mencetak atau menyimpan sebagai PDF.</p></div><button class="icon-btn" onclick="closeModal()" aria-label="Tutup">${icon('x')}</button></div>
        <div class="modal-body"><div class="print-preview-wrap"><iframe id="printPreviewFrame" class="print-preview-frame" title="Preview cetak"></iframe></div></div>
        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="printCurrentPreview()">${icon('printer')} Cetak / Simpan PDF</button></div>
      `, true);
      setTimeout(()=>{
        const frame = document.getElementById('printPreviewFrame');
        if (frame) frame.srcdoc = documentHtml;
      },0);
    }

    function printCurrentPreview() {
      const frame = document.getElementById('printPreviewFrame');
      try {
        if (frame?.contentWindow) {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          return;
        }
      } catch (err) {}
      const html = state.printDocument?.html;
      if (!html) { toast('Preview cetak tidak tersedia.', 'warning'); return; }
      const w = window.open('', '_blank');
      if (!w) { toast('Browser memblokir jendela cetak.', 'warning'); return; }
      w.document.open(); w.document.write(html); w.document.close();
      w.onload = () => { w.focus(); w.print(); };
    }

    function printHistoryReceipt(idTransaksi) {
      const d = state.selectedStudentDetail;
      const h = d?.history?.find(x => x.idTransaksi === idTransaksi);
      if (!d || !h) { toast('Data bukti belum tersedia. Tekan Refresh lalu coba lagi.','warning'); return; }
      printReceipt({
        idTransaksi:h.idTransaksi,
        student:d.student,
        bulan:h.bulan,
        tahun:h.tahun,
        nominal:h.nominal,
        tanggalBayar:h.tanggalBayar,
        waktuBayar:h.waktuBayar,
        status:'LUNAS'
      });
    }

    function printReceipt(tx) {
      const w = window.open('', '_blank', 'width=520,height=720');
      if (!w) { toast('Izinkan pop-up browser untuk mencetak bukti.','warning'); return; }
      w.document.write(`<!doctype html><html><head><title>Bukti Pembayaran Komite</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#16314d}main{max-width:420px;margin:auto;border:1px solid #dce6ef;border-radius:18px;padding:24px}h2{text-align:center;margin:0 0 4px}.sub{text-align:center;color:#65758a;font-size:12px}.amount{text-align:center;font-size:30px;font-weight:700;margin:20px 0}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:12px}.foot{text-align:center;color:#738395;font-size:10px;margin-top:20px}@media print{body{padding:0}main{border:0}}


</style></head><body><main><h2>Komite SMP Negeri 3 Jayapura</h2><div class="sub">Bukti Pembayaran Komite</div><div class="amount">${money(tx.nominal)}</div><div class="row"><span>Nama</span><strong>${escapeHtml(tx.student.nama)}</strong></div><div class="row"><span>Kelas</span><strong>${escapeHtml(normalizeClassLabel(tx.student.kelas))}</strong></div><div class="row"><span>Periode</span><strong>${titleCase(tx.bulan)} ${tx.tahun}</strong></div><div class="row"><span>Tanggal</span><strong>${escapeHtml(tx.tanggalBayar)}</strong></div><div class="row"><span>Status</span><strong>LUNAS</strong></div><div class="foot">SMP Negeri 3 Jayapura • Tahun Pelajaran ${escapeHtml(state.config.schoolYear)}</div></main><script>window.onload=()=>{window.print()}<\/script></body></html>`);
      w.document.close();
    }

    function confirmCancel(idTransaksi) {
      openModal(`
        <div class="modal-head"><div><h3>Batalkan pembayaran?</h3><p>Pembayaran akan dibatalkan dan tetap tercatat dalam riwayat.</p></div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
        <div class="modal-body"><div class="card card-pad"><p style="margin:0;color:var(--muted);font-size:13px;line-height:1.5">Gunakan hanya bila Bendahara salah mencatat pembayaran. Riwayat pembatalan tetap tersimpan.</p></div></div>
        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Tidak</button><button class="btn btn-danger" onclick="cancelPayment('${escapeHtml(idTransaksi)}')">${icon('trash')} Ya, Batalkan</button></div>`);
    }

    async function cancelPayment(idTransaksi) {
      try {
        const record = (state.payments || []).find(x => x.idTransaksi === idTransaksi);
        const idSiswa = record?.idSiswa || state.selectedStudentDetail?.student?.idSiswa;
        await api('cancelPayment', {token:state.token,idTransaksi}, {loadingText:'Membatalkan pembayaran…'});
        toast('Pembayaran berhasil dibatalkan.', 'success');
        if (record) {
          state.payments = state.payments.filter(x => x.idTransaksi !== idTransaksi);
          const listStudent = state.students.find(x => x.idSiswa === record.idSiswa);
          if (listStudent) {
            const key = `${record.bulan}-${record.tahun}`;
            listStudent.paidPeriods = (listStudent.paidPeriods || []).filter(x => x !== key);
            listStudent.paidMonths = listStudent.paidPeriods.length;
            listStudent.unpaidMonths = Math.max(0,(state.config.periods||[]).length-listStudent.paidMonths);
          }
        }
        if (idSiswa) {
          const d = buildLocalStudentDetail(idSiswa);
          if (d) {
            state.detailCache[idSiswa] = d;
            state.selectedStudentDetail = d;
          }
        }
        const local=buildLocalSummaryData();
        state.summary=local;
        state.dashboard={user:state.user,scope:local.scope,stats:summaryStatsFromSummary(local.summary),config:state.config};
        saveStaffSnapshot();
        if (idSiswa && state.selectedStudentDetail) openModal(studentDetailModalHtml(state.selectedStudentDetail, false), true); else closeModal();
      } catch (err) { toast(err.message,'error'); }
    }

    // ========================= REKAP =========================

    function renderSummaryView() {
      const html = `
        ${periodControlsHtml()}
        <div class="section-head"><div><h2>Rekap Pembayaran</h2><p>Ringkasan Pembayaran Komite sesuai periode dan kelas yang dipilih.</p></div><button class="btn btn-soft btn-sm" onclick="downloadSummaryCsv()">${icon('download')} Unduh CSV</button></div>
        <section class="card card-pad"><div id="summaryBody">${summaryBodyHtml(state.summary)}</div></section>`;
      renderStaffShell(html);
    }

    function summaryBodyHtml(data) {
      const s = data?.summary || {};
      const scope = data?.scope || {};
      const many = (scope.periods?.length || 1) > 1;
      return `<div class="summary-grid">
        <div class="metric"><span>Siswa</span><strong>${s.totalStudents||0}</strong></div>
        <div class="metric"><span>${many?'Pembayaran Lunas':'Lunas'}</span><strong style="color:var(--green)">${s.paid||0}${many?`/${s.totalSlots||0}`:''}</strong></div>
        <div class="metric"><span>Belum</span><strong style="color:var(--orange)">${s.unpaid||0}</strong></div>
        <div class="metric"><span>Terkumpul</span><strong style="font-size:19px">${money(s.totalAmount||0)}</strong></div>
      </div>
      <div class="section-head"><div><h2>Daftar Siswa</h2><p>${escapeHtml(scope.label || '')} • ${escapeHtml(data?.kelas || 'SEMUA')}${Number(s.future||0)>0?` • ${s.future} pembayaran belum jatuh tempo`:''}</p></div><span class="status-pill ok">${s.percentage||0}% lunas</span></div>
      ${summaryStudentsHtml(s.students || [], false)}`;
    }

    function summaryStudentsHtml(list, preview=false) {
      const rows = preview ? list.slice(0,6) : list;
      if (!rows.length) return emptyHtml('Belum ada siswa','Belum ada data siswa yang tersedia.');
      const many = (state.summary?.scope?.periods?.length || 1) > 1;
      return `<div class="student-list" style="margin-top:0">${rows.map(x=>{
        let cls = 'future', txt = 'Belum Jatuh Tempo', ic = 'calendar';
        if (x.status === 'LUNAS') { cls='ok'; txt = many ? `${x.paidMonths}/${x.totalMonths} lunas` : 'Lunas'; ic='check'; }
        else if (x.status === 'BELUM_BAYAR') { cls='wait'; txt = many ? `${x.paidMonths}/${x.totalMonths} lunas` : 'Belum'; ic='clock'; }
        else if (x.status === 'SEBAGIAN') { cls='sync'; txt=`${x.paidMonths}/${x.totalMonths} lunas`; ic='clock'; }
        return `<button class="student-row" onclick="openStudentDetail('${escapeHtml(x.idSiswa)}',false)"><span class="avatar">${escapeHtml(initials(x.nama).toUpperCase())}</span><span class="student-main"><strong>${escapeHtml(x.nama)}</strong><span class="student-meta">${escapeHtml(x.kelas)} • NISN ${escapeHtml(x.nisn)}</span></span><span class="status-pill ${cls}">${icon(ic)} ${escapeHtml(txt)}</span></button>`;
      }).join('')}</div>`;
    }

    function downloadSummaryCsv() {
      const d = state.summary;
      if (!d?.summary?.students) { toast('Rekap belum tersedia.','warning'); return; }
      const many = (d.scope?.periods?.length || 1) > 1;
      const rows = many
        ? [['NISN','NAMA_SISWA','KELAS','PERIODE','LUNAS','TOTAL_BULAN','STATUS']]
        : [['NISN','NAMA_SISWA','KELAS','PERIODE','STATUS']];
      d.summary.students.forEach(s => {
        if (many) rows.push([s.nisn,s.nama,s.kelas,d.scope.label,s.paidMonths,s.totalMonths,s.status]);
        else rows.push([s.nisn,s.nama,s.kelas,d.scope.label,s.status]);
      });
      const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Rekap_Komite_${String(d.scope.label||'Periode').replace(/\s+/g,'_')}_${(d.kelas||'SEMUA').replace(/\s+/g,'_')}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
      toast('Rekap CSV berhasil dibuat.','success');
    }

    // ========================= SISWA =========================

    function renderStudentApp(detail) {
      const d = detail || state.selectedStudentDetail;
      const s = d.student;
      document.getElementById('app').innerHTML = `${topbar()}<main class="page main">
        <section class="hero student-profile-hero">
          <div>
            <div class="hero-kicker">Pembayaran Komite • ${escapeHtml(normalizeClassLabel(s.kelas))}</div>
            <div class="hero-title">${escapeHtml(s.nama)}</div>
            <div class="hero-sub">NISN ${escapeHtml(s.nisn)} • Tahun Pelajaran ${escapeHtml(state.config.schoolYear)}</div>
            <div class="student-progress-inline">${d.paidMonths}/${d.totalMonths} Bulan Lunas</div>
            <div class="amount">${money(d.paidAmount)}</div><div class="amount-label">Total telah dibayar</div>
          </div>
          <div class="paid-circle"><div><strong>${d.paidMonths}/${d.totalMonths}</strong><span>Bulan Lunas</span></div></div>
        </section>
        <div class="section-head"><div><h2>Status Pembayaran</h2><p>${escapeHtml(state.config.startMonth)} — ${escapeHtml(state.config.endMonth)}</p></div><span class="status-pill ok">${money(state.config.amount)} / bulan</span></div>
        <div class="months-grid">${d.periods.map(p=>monthCardHtml(p,s.idSiswa,false)).join('')}</div>
        <div class="section-head history-heading-actions"><div><h2>Riwayat Pembayaran</h2><p>Transaksi Pembayaran Komite yang telah lunas.</p></div><button class="btn btn-soft btn-sm print-card-btn" onclick="previewStudentCard('${escapeHtml(s.idSiswa)}')" title="Cetak Kartu Komite">${icon('printer')}<span class="print-card-label">Cetak Kartu Komite</span></button></div>
        <section class="card card-pad">${historyHtml(d.history,false)}</section>
        ${treasurerAccountsHtml()}
      </main>`;
    }

    function emptyHtml(title, sub) {
      return `<div class="empty"><div class="empty-icon">${icon('search')}</div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(sub)}</span></div>`;
    }

    // ========================= RESTORE / NETWORK EVENTS =========================

    async function restoreSession() {
      if (!state.token || !state.user) return false;
      if (state.user.role === 'SISWA') {
        const snap = loadStudentSnapshot();
        if (snap?.detail) {
          state.config = Object.assign({}, state.config, snap.config || {});
          state.config.classes = (state.config.classes || []).map(c=>Object.assign({},c,{nama:normalizeClassLabel(c.nama)}));
          state.selectedStudentDetail = snap.detail;
          state.detailCache[snap.detail.student.idSiswa] = snap.detail;
          renderStudentApp(snap.detail);
        }
        if (!navigator.onLine) {
          if (snap?.detail) return true;
          return false;
        }
        try {
          const d = await api('studentDetail', {token:state.token}, {silent:true, timeout:15000});
          state.selectedStudentDetail = d;
          state.detailCache[d.student.idSiswa] = d;
          saveStudentSnapshot(d);
          renderStudentApp(d);
          return true;
        } catch (err) {
          if (isSessionError(err.message)) { clearSession(false); return false; }
          if (snap?.detail) return true;
          return false;
        }
      }

      const snap = loadStaffSnapshot();
      if (snap) {
        state.config = Object.assign({}, state.config, snap.config || {});
        state.students = snap.students || [];
        state.payments = snap.payments || [];
        state.summary = snap.summary || null;
        state.dashboard = snap.dashboard || null;
        state.scopeMode = snap.scopeMode || 'MONTH';
        state.scopeMonthIndex = Number.isFinite(snap.scopeMonthIndex) ? snap.scopeMonthIndex : 0;
        state.scopeClass = snap.scopeClass || '';
        rememberCurrentSummary();
        renderStaffShell();
      }
      if (!navigator.onLine) {
        if (snap) {
          return true;
        }
        return false;
      }

      try {
        const data = await api('staffBootstrap', Object.assign({token:state.token}, scopePayload(false)), {silent:true, timeout:19000});
        applyBootstrap(data, true);
        renderCurrentStaffView();
        if (state.user.role === 'BENDAHARA') setTimeout(() => syncPaymentQueue(), 350);
        return true;
      } catch (err) {
        if (isSessionError(err.message)) { clearSession(false); return false; }
        if (snap) return true;
        return false;
      }
    }

    async function boot() {
      if (!state.token || !state.user) {
        renderLogin();
        loadPublicConfig().then(() => { if (!state.user) renderLogin(); });
        updateSyncIndicator();
        return;
      }
      const restored = await restoreSession();
      if (!restored) renderLogin();
      updateSyncIndicator();
      loadPublicConfig().catch(()=>{});
    }

    window.addEventListener('online', () => {
      updateSyncIndicator();
      if (state.user?.role === 'BENDAHARA') syncPaymentQueue();
    });

    window.addEventListener('offline', () => {
      updateSyncIndicator();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && navigator.onLine && state.user?.role === 'BENDAHARA' && queueCount()) syncPaymentQueue();
    });

    boot();

  </script>
</body>
</html>
