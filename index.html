<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>Komite SMP Negeri 3 Jayapura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f8fc;
      --surface: #ffffff;
      --surface-2: #f8fbff;
      --text: #10233a;
      --muted: #65758a;
      --line: #e5edf6;
      --navy: #0b3158;
      --blue: #1769d2;
      --blue-2: #3d8df5;
      --cyan: #8bdcff;
      --green: #168b63;
      --green-soft: #eaf8f2;
      --orange: #d97706;
      --orange-soft: #fff5e8;
      --red: #c43b4d;
      --red-soft: #fff0f2;
      --shadow: 0 14px 40px rgba(25, 65, 110, .09);
      --shadow-soft: 0 8px 26px rgba(25, 65, 110, .07);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans Flex", "Google Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    a { color: inherit; }
    .hidden { display: none !important; }

    .app-root { min-height: 100vh; }
    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .main { padding: 24px 0 104px; }

    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,.91);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(229,237,246,.88);
    }
    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 15px;
      display: grid; place-items: center; color: white;
      background: linear-gradient(145deg, var(--navy), var(--blue) 60%, #6dc8f8);
      box-shadow: 0 10px 24px rgba(23,105,210,.24);
      flex: 0 0 auto;
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-text { min-width: 0; }
    .brand-title { font-weight: 720; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .user-pill {
      display: flex; align-items: center; gap: 9px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
      color: var(--muted); font-size: 13px;
    }
    .user-pill strong { color: var(--text); font-weight: 650; }
    .icon-btn {
      width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--surface); color: var(--text); display: grid; place-items: center;
      transition: .18s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); border-color: #cbdced; background: var(--surface-2); }
    .icon-btn svg { width: 20px; height: 20px; }

    .desktop-nav { display: flex; gap: 6px; padding: 10px; background: white; border: 1px solid var(--line); border-radius: 18px; margin-top: 18px; }
    .nav-chip {
      flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); border-radius: 12px;
      padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px;
    }
    .nav-chip.active { background: #eef6ff; color: var(--blue); }
    .nav-chip svg { width: 18px; height: 18px; }

    .hero {
      margin-top: 22px;
      border-radius: var(--radius-xl);
      padding: 28px;
      color: white;
      background:
        radial-gradient(circle at 82% 15%, rgba(139,220,255,.38), transparent 31%),
        radial-gradient(circle at 15% 90%, rgba(61,141,245,.25), transparent 38%),
        linear-gradient(135deg, #092f55 0%, #0f579e 52%, #2b87e9 100%);
      box-shadow: 0 20px 50px rgba(9, 60, 110, .18);
      overflow: hidden;
      position: relative;
    }
    .hero::after {
      content: ""; position: absolute; width: 240px; height: 240px; right: -100px; bottom: -160px;
      border: 1px solid rgba(255,255,255,.18); border-radius: 50%; box-shadow: 0 0 0 28px rgba(255,255,255,.035), 0 0 0 56px rgba(255,255,255,.025);
    }
    .hero-kicker { font-size: 13px; opacity: .78; letter-spacing: .02em; }
    .hero-title { margin: 7px 0 4px; font-size: clamp(25px, 4vw, 40px); font-weight: 760; letter-spacing: -.035em; }
    .hero-sub { opacity: .78; font-size: 14px; }
    .hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 28px; max-width: 720px; }
    .hero-stat { padding: 14px 16px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); border-radius: 17px; backdrop-filter: blur(8px); }
    .hero-stat small { display: block; opacity: .72; font-size: 12px; }
    .hero-stat strong { display: block; margin-top: 4px; font-size: clamp(20px, 3vw, 29px); font-weight: 730; }

    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 28px 0 14px; }
    .section-head h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .action-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .action-card {
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-lg); padding: 18px;
      text-align: left; min-height: 134px; box-shadow: var(--shadow-soft); transition: .18s ease; color: var(--text);
    }
    .action-card:hover { transform: translateY(-2px); border-color: #cfe0f1; box-shadow: var(--shadow); }
    .action-icon { width: 42px; height: 42px; border-radius: 14px; background: #eef6ff; color: var(--blue); display: grid; place-items: center; }
    .action-icon svg { width: 21px; height: 21px; }
    .action-card strong { display: block; margin-top: 18px; font-weight: 690; }
    .action-card span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .action-card.primary { background: linear-gradient(145deg, #f4f9ff, #ffffff); border-color: #cfe6ff; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); }
    .card-pad { padding: 20px; }
    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .toolbar.three { grid-template-columns: 1fr 180px 180px; }
    .field-wrap { position: relative; }
    .field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8192a6; pointer-events: none; display: grid; }
    .field-icon svg { width: 18px; height: 18px; }
    .input, .select {
      width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 14px; background: #fbfdff;
      color: var(--text); padding: 0 14px; outline: none; transition: .16s ease;
    }
    .field-wrap .input { padding-left: 43px; }
    .input:focus, .select:focus { border-color: #80b9f4; box-shadow: 0 0 0 4px rgba(23,105,210,.08); background: white; }
    .label { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin: 0 0 7px 2px; }

    .btn {
      min-height: 46px; border: 0; border-radius: 14px; padding: 0 17px; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-weight: 650; transition: .18s ease; white-space: nowrap;
    }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { color: white; background: linear-gradient(135deg, var(--navy), var(--blue) 68%, #4ea4f3); box-shadow: 0 9px 22px rgba(23,105,210,.19); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 11px 26px rgba(23,105,210,.24); }
    .btn-soft { color: var(--blue); background: #edf6ff; border: 1px solid #d8ebff; }
    .btn-ghost { color: var(--text); background: white; border: 1px solid var(--line); }
    .btn-danger { color: var(--red); background: var(--red-soft); border: 1px solid #ffd8dd; }
    .btn-sm { min-height: 38px; padding: 0 12px; border-radius: 12px; font-size: 13px; }

    .student-list { display: grid; gap: 9px; margin-top: 16px; }
    .student-row {
      width: 100%; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 12px;
      padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: white; color: var(--text); text-align: left; transition: .16s ease;
    }
    .student-row:hover { border-color: #cfe0f1; background: #fbfdff; }
    .avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #edf6ff; color: var(--blue); font-weight: 730; }
    .student-main { min-width: 0; }
    .student-main strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student-meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 7px; flex-wrap: wrap; }
    .chev { color: #9aabba; display: grid; }
    .chev svg { width: 18px; height: 18px; }

    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .status-pill.ok { background: var(--green-soft); color: var(--green); }
    .status-pill.wait { background: var(--orange-soft); color: var(--orange); }
    .status-pill.future { background: #f1f4f7; color: #77879a; }
    .status-pill.cancel { background: var(--red-soft); color: var(--red); }
    .status-pill svg { width: 14px; height: 14px; }

    .months-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .month-card { border: 1px solid var(--line); border-radius: 17px; padding: 14px; background: white; min-height: 100px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
    .month-card.clickable { cursor: pointer; transition: .16s ease; }
    .month-card.clickable:hover { border-color: #8fc2f4; background: #f8fbff; transform: translateY(-1px); }
    .month-name { font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--text); }
    .month-year { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .history-list { display: grid; gap: 10px; }
    .history-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .history-row:last-child { border-bottom: 0; }
    .history-row strong { display: block; font-size: 14px; }
    .history-row .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .history-amount { text-align: right; }
    .history-amount strong { font-variant-numeric: tabular-nums; }

    .summary-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-top: 16px; }
    .metric { padding: 17px; border: 1px solid var(--line); border-radius: 18px; background: white; }
    .metric span { color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 5px; font-size: 24px; letter-spacing: -.03em; }

    .empty { text-align: center; padding: 42px 20px; color: var(--muted); }
    .empty-icon { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 18px; display: grid; place-items: center; background: #f1f6fb; color: #7c91a7; }
    .empty-icon svg { width: 24px; height: 24px; }
    .empty strong { color: var(--text); display: block; margin-bottom: 4px; }

    .bottom-nav {
      display: none; position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--safe-bottom));
      width: min(94%, 480px); padding: 7px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 18px 48px rgba(18, 57, 95, .16); backdrop-filter: blur(18px);
    }
    .bottom-nav button { flex: 1; min-height: 54px; border: 0; background: transparent; border-radius: 16px; color: var(--muted); display: grid; place-items: center; gap: 2px; font-size: 10px; }
    .bottom-nav button.active { color: var(--blue); background: #eef6ff; }
    .bottom-nav svg { width: 20px; height: 20px; }

    .login-page {
      min-height: 100vh; display: grid; grid-template-columns: minmax(0,1.1fr) minmax(400px,.9fr); background: white;
    }
    .login-art {
      position: relative; overflow: hidden; padding: 52px; color: white;
      background:
        radial-gradient(circle at 20% 18%, rgba(139,220,255,.38), transparent 28%),
        radial-gradient(circle at 78% 78%, rgba(58,144,245,.28), transparent 36%),
        linear-gradient(145deg, #092c50 0%, #0f4e8d 48%, #2481df 100%);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .login-art::before, .login-art::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; }
    .login-art::before { width: 480px; height: 480px; right: -260px; top: -180px; box-shadow: 0 0 0 54px rgba(255,255,255,.025), 0 0 0 108px rgba(255,255,255,.018); }
    .login-art::after { width: 320px; height: 320px; left: -180px; bottom: -170px; box-shadow: 0 0 0 42px rgba(255,255,255,.022); }
    .login-brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
    .login-brand .brand-mark { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); box-shadow: none; }
    .login-copy { position: relative; z-index: 1; max-width: 620px; }
    .login-copy h1 { font-size: clamp(36px,5vw,68px); line-height: .99; letter-spacing: -.052em; margin: 0 0 18px; font-weight: 780; }
    .login-copy p { max-width: 520px; margin: 0; opacity: .76; font-size: 16px; line-height: 1.55; }
    .login-mini { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; }
    .login-mini span { padding: 8px 11px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); border-radius: 999px; font-size: 11px; opacity: .88; }
    .login-panel { display: grid; place-items: center; padding: 34px; background: #fbfdff; }
    .login-box { width: min(100%, 470px); }
    .login-mobile-brand { display: none; margin-bottom: 24px; }
    .login-box h2 { margin: 0; font-size: 30px; letter-spacing: -.035em; }
    .login-box > p { margin: 8px 0 22px; color: var(--muted); line-height: 1.5; }
    .segment { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; padding: 5px; background: #eef3f8; border-radius: 15px; margin-bottom: 22px; }
    .segment button { border: 0; background: transparent; min-height: 42px; border-radius: 11px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .segment button.active { background: white; color: var(--blue); box-shadow: 0 3px 12px rgba(25,65,110,.08); }
    .form-stack { display: grid; gap: 14px; }
    .login-btn { min-height: 51px; width: 100%; margin-top: 2px; }
    .login-foot { color: var(--muted); font-size: 11px; line-height: 1.45; margin-top: 18px; text-align: center; }

    .student-profile-hero { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 18px; }
    .student-profile-hero .amount { font-size: clamp(29px,5vw,48px); font-weight: 760; letter-spacing: -.045em; margin-top: 18px; }
    .student-profile-hero .amount-label { font-size: 12px; opacity: .7; }
    .student-profile-hero .paid-circle { width: 112px; height: 112px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); display: grid; place-items: center; text-align: center; }
    .paid-circle strong { font-size: 27px; display: block; }
    .paid-circle span { opacity: .72; font-size: 11px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(9,30,52,.46); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 18px; animation: fadeIn .16s ease; }
    .modal {
      width: min(760px, 100%); max-height: min(90vh, 900px); overflow: auto; background: white; border: 1px solid rgba(255,255,255,.7);
      border-radius: 26px; box-shadow: 0 28px 80px rgba(5,31,58,.25); animation: pop .2s ease;
    }
    .modal.large { width: min(920px, 100%); }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 20px 14px; background: rgba(255,255,255,.95); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; font-size: 19px; }
    .modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px 20px; }

    .receipt { text-align: center; padding: 6px 4px; }
    .success-mark { width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center; color: var(--green); background: var(--green-soft); }
    .success-mark svg { width: 32px; height: 32px; }
    .receipt h3 { margin: 0; font-size: 23px; }
    .receipt .receipt-name { margin-top: 18px; font-size: 17px; font-weight: 680; }
    .receipt .receipt-amount { font-size: 31px; font-weight: 770; letter-spacing: -.035em; margin: 7px 0; }
    .receipt-details { margin: 18px auto 0; max-width: 450px; border: 1px solid var(--line); border-radius: 17px; overflow: hidden; text-align: left; }
    .receipt-details div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 13px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .receipt-details div:last-child { border-bottom: 0; }
    .receipt-details span { color: var(--muted); }

    .toast-container { position: fixed; z-index: 100; top: 18px; right: 18px; width: min(390px, calc(100% - 28px)); display: grid; gap: 10px; pointer-events: none; }
    .toast { pointer-events: auto; display: grid; grid-template-columns: 34px minmax(0,1fr) 28px; gap: 9px; align-items: center; padding: 11px; background: rgba(255,255,255,.98); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 46px rgba(15,47,80,.16); animation: toastIn .25s ease; }
    .toast-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; }
    .toast-icon svg { width: 17px; height: 17px; }
    .toast.success .toast-icon { color: var(--green); background: var(--green-soft); }
    .toast.error .toast-icon { color: var(--red); background: var(--red-soft); }
    .toast.warning .toast-icon { color: var(--orange); background: var(--orange-soft); }
    .toast.info .toast-icon { color: var(--blue); background: #edf6ff; }
    .toast strong { display: block; font-size: 13px; }
    .toast p { margin: 2px 0 0; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .toast-close { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; color: #91a0ae; border-radius: 9px; }
    .toast-close svg { width: 15px; height: 15px; }

    .loading-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(248,251,255,.76); backdrop-filter: blur(4px); display: grid; place-items: center; }
    .loader-card { display: flex; align-items: center; gap: 11px; padding: 13px 16px; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); color: var(--muted); font-size: 13px; }
    .spinner { width: 19px; height: 19px; border: 2px solid #d7e5f3; border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }

    @media (max-width: 860px) {
      .login-page { grid-template-columns: 1fr; background: #fbfdff; }
      .login-art { display: none; }
      .login-panel { padding: 24px; min-height: 100vh; }
      .login-mobile-brand { display: flex; align-items: center; gap: 12px; }
      .desktop-nav { display: none; }
      .bottom-nav { display: flex; }
      .main { padding-top: 14px; }
      .action-grid { grid-template-columns: repeat(3,1fr); }
      .action-card { min-height: 120px; padding: 15px; }
      .toolbar.three { grid-template-columns: 1fr 145px; }
      .toolbar.three > :last-child { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: repeat(2,1fr); }
      .months-grid { grid-template-columns: repeat(3,1fr); }
      .user-pill { display: none; }
    }

    @media (max-width: 600px) {
      .page { width: min(100% - 22px, 1180px); }
      .topbar { min-height: 64px; }
      .brand-mark { width: 40px; height: 40px; border-radius: 13px; }
      .brand-title { font-size: 14px; max-width: 210px; }
      .brand-sub { font-size: 10px; }
      .hero { padding: 21px; border-radius: 24px; margin-top: 13px; }
      .hero-stats { grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 22px; }
      .hero-stat { padding: 11px 9px; border-radius: 14px; }
      .hero-stat strong { font-size: 21px; }
      .hero-stat small { font-size: 10px; }
      .action-grid { grid-template-columns: repeat(3,1fr); gap: 8px; }
      .action-card { min-height: 108px; border-radius: 17px; padding: 12px; }

    /* ===== Revisi 1.01: periode, refresh, sinkronisasi, toast gesture ===== */
    .status-pill.sync { background: #edf6ff; color: var(--blue); }

    .refresh-btn.spinning svg { animation: spin .75s linear infinite; }

    .sync-chip {
      min-height: 38px; border: 1px solid var(--line); border-radius: 999px; padding: 0 11px;

    .sync-chip.ok { color: var(--green); background: var(--green-soft); border-color: #d4efe4; }
    .sync-chip.pending { color: var(--orange); background: var(--orange-soft); border-color: #ffe2ba; }
    .sync-chip.offline { color: var(--red); background: var(--red-soft); border-color: #ffd9df; }

    .period-panel {

      position: relative; grid-template-columns: 34px minmax(0,1fr); padding: 12px 42px 12px 11px;

      transition: transform .18s ease, opacity .18s ease;

    @media (max-width: 860px) {

<body>
  <div id="app" class="app-root"></div>
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loader-card"><span class="spinner"></span><span id="loadingText">Memuat data…</span></div>
  </div>
  <div id="modalRoot"></div>

  <script>
    // ==========================================================
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT /exec
    // ==========================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbwGnX_NSuKpyMf30_nZdKTLlyL_BHXbat8rRdAhxweAva3qUaiu3lmaroemJdlys-v9zQ/exec';
    const APP_REVISION = 'Revisi 1.01';
    const STORAGE = {
      TOKEN: 'komite_token',
      USER: 'komite_user',
      QUEUE: 'komite_payment_queue_v1',
      STAFF_SNAPSHOT: 'komite_staff_snapshot_v1',
      STUDENT_SNAPSHOT: 'komite_student_snapshot_v1'
    };

    const DEFAULT_CONFIG = {
      appName: 'Komite SMP Negeri 3 Jayapura',
      schoolName: 'SMP Negeri 3 Jayapura',
      schoolYear: '2026/2027',
      level: 'VII',
      amount: 50000,
      startMonth: 'JULI 2026',
      endMonth: 'JUNI 2027',
      periods: [
        ['JULI',2026],['AGUSTUS',2026],['SEPTEMBER',2026],['OKTOBER',2026],['NOVEMBER',2026],['DESEMBER',2026],
        ['JANUARI',2027],['FEBRUARI',2027],['MARET',2027],['APRIL',2027],['MEI',2027],['JUNI',2027]
      ].map(([bulan,tahun]) => ({bulan,tahun,label: titleCase(bulan) + ' ' + tahun})),
      classes: 'ABCDEFGHIJ'.split('').map(x => ({id:'K07'+x,nama:'VII '+x})),
      currentPeriod: {bulan:'AGUSTUS',tahun:2026,label:'Agustus 2026'},
      revision: '1.01'
    };

    const state = {
      config: DEFAULT_CONFIG,
      token: localStorage.getItem(STORAGE.TOKEN) || '',
      user: safeJson(localStorage.getItem(STORAGE.USER)),
      loginRole: 'SISWA',
      currentView: 'home',
      students: [],
      summary: null,
      dashboard: null,
      selectedStudentDetail: null,
      detailCache: {},
      summaryCache: {},
      scopeMode: 'MONTH',
      scopeMonthIndex: 0,
      scopeClass: '',
      syncing: false,
      refreshBusy: false,
      silentRefreshTimer: null
    };

    const icons = {
      shield: '<path d="M12 3 5.5 5.8v4.7c0 4.1 2.5 7.4 6.5 9.5 4-2.1 6.5-5.4 6.5-9.5V5.8L12 3Z"/><path d="m9.5 12 1.7 1.7 3.6-4"/>',
      home: '<path d="m3 11 9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      chart: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      logout: '<path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/>',
      chevron: '<path d="m9 18 6-6-6-6"/>',
      left: '<path d="m15 18-6-6 6-6"/>',
      right: '<path d="m9 18 6-6-6-6"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>',
      alert: '<path d="M10.3 3.7 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      x: '<path d="M6 6l12 12M18 6 6 18"/>',
      receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/>',
      download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
      wallet: '<path d="M4 6h15a2 2 0 0 1 2 2v10H5a2 2 0 0 1-2-2V7a4 4 0 0 1 4-4h10"/><path d="M16 11h5v4h-5a2 2 0 0 1 0-4Z"/>',
      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m7 7 1 14h8l1-14"/><path d="M10 11v6M14 11v6"/>',
      printer: '<path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/>',
      calendar: '<path d="M6 3v3M18 3v3"/><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/>',
      arrow: '<path d="M5 12h14"/><path d="m14 7 5 5-5 5"/>',
      refresh: '<path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.5-2.6L20 11"/><path d="m4 13 2.4 4.6A7 7 0 0 0 18 15"/>',
      cloud: '<path d="M17.5 19H7a5 5 0 1 1 1.2-9.85A6.5 6.5 0 0 1 20 12.5 3.5 3.5 0 0 1 17.5 19Z"/><path d="m9.5 14 1.7 1.7 3.6-4"/>',
      offline: '<path d="M17.5 19H7a5 5 0 0 1-1.6-9.74"/><path d="M8.2 6.7A6.5 6.5 0 0 1 20 12.5c0 .3 0 .6-.1.9"/><path d="M3 3l18 18"/>'
    };

    function icon(name, cls='') {
      return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.info}</svg>`;
    }

    function safeJson(text) {
      try { return text ? JSON.parse(text) : null; } catch (_) { return null; }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function titleCase(text) {
      const s = String(text || '').toLowerCase();
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    }

    function money(value) {
      return new Intl.NumberFormat('id-ID', {style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(value || 0));
    }

    function initials(name) {
      const p = String(name || '').trim().split(/\s+/).filter(Boolean);
      return (p[0]?.[0] || '') + (p[1]?.[0] || p[0]?.[1] || '');
    }

    function isApiConfigured() {
      return /^https:\/\/.+\/exec(?:\?.*)?$/.test(API_URL) && !API_URL.includes('PASTE_URL');
    }

    function isSessionError(message) {
      return /sesi (tidak valid|telah berakhir)/i.test(String(message || ''));
    }

    function isNetworkLikeError(err) {
      const m = String(err?.message || err || '');
      return !navigator.onLine || /fetch|network|failed|abort|timeout|terhubung/i.test(m);
    }

    async function api(action, data = {}, opts = {}) {
      if (!isApiConfigured()) throw new Error('URL Apps Script belum dipasang di index.html.');
      const timeout = Number(opts.timeout || 18000);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      if (!opts.silent) loading(true, opts.loadingText || 'Memuat data…');
      try {
        const payload = Object.assign({ action }, data);
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: new URLSearchParams({ payload: JSON.stringify(payload) }),
          redirect: 'follow',
          signal: controller.signal
        });
        const text = await res.text();
        let json;
        try { json = JSON.parse(text); }
        catch (_) { throw new Error('Respons backend tidak valid. Pastikan URL Web App menggunakan /exec dan deployment sudah aktif.'); }
        if (!json.ok) throw new Error(json.message || 'Permintaan gagal.');
        return json.data;
      } catch (err) {
        const mapped = err?.name === 'AbortError' ? new Error('Koneksi ke server terlalu lama.') : err;
        if (isSessionError(mapped?.message)) {
          clearSession(false);
          renderLogin();
        }
        throw mapped;
      } finally {
        clearTimeout(timer);
        if (!opts.silent) loading(false);
      }
    }

    function loading(show, text='Memuat data…') {
      const label = document.getElementById('loadingText');
      const overlay = document.getElementById('loadingOverlay');
      if (label) label.textContent = text;
      if (overlay) overlay.classList.toggle('hidden', !show);
    }

    function toast(message, type='info', title='', duration) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const map = {
        success: {icon:'check', title:'Berhasil'},
        error: {icon:'alert', title:'Terjadi kesalahan'},
        warning: {icon:'alert', title:'Perhatian'},
        info: {icon:'info', title:'Informasi'}
      };
      const m = map[type] || map.info;
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<div class="toast-icon">${icon(m.icon)}</div><div class="toast-copy"><strong>${escapeHtml(title || m.title)}</strong><p>${escapeHtml(message)}</p></div><button class="toast-close" aria-label="Tutup">${icon('x')}</button>`;
      container.appendChild(el);

      let timer = setTimeout(() => dismissToast(el, 'fade'), Number(duration || (type === 'error' ? 5600 : type === 'warning' ? 4800 : 3900)));
      el._toastTimer = timer;
      el.querySelector('.toast-close').addEventListener('click', e => {
        e.stopPropagation();
        dismissToast(el, 'right');
      });
      attachToastGesture(el);
    }

    function attachToastGesture(el) {
      let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
      el.addEventListener('pointerdown', e => {
        if (e.target.closest('.toast-close')) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        dx = 0; dy = 0;
        el.classList.add('dragging');
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        if (el._toastTimer) clearTimeout(el._toastTimer);
      });
      el.addEventListener('pointermove', e => {
        if (!dragging) return;
        dx = e.clientX - startX;
        dy = Math.min(0, e.clientY - startY);
        const opacity = Math.max(.28, 1 - Math.max(Math.abs(dx) / 210, Math.abs(dy) / 150));
        el.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
        el.style.opacity = String(opacity);
      });
      const finish = e => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
        if (Math.abs(dx) >= 68) dismissToast(el, dx < 0 ? 'left' : 'right');
        else if (dy <= -48) dismissToast(el, 'up');
        else {
          el.style.transform = '';
          el.style.opacity = '';
          el._toastTimer = setTimeout(() => dismissToast(el, 'fade'), 2400);
        }
      };
      el.addEventListener('pointerup', finish);
      el.addEventListener('pointercancel', finish);
    }

    function dismissToast(el, direction='fade') {
      if (!el || !el.isConnected || el.dataset.closing === '1') return;
      el.dataset.closing = '1';
      if (el._toastTimer) clearTimeout(el._toastTimer);
      el.classList.remove('dragging');
      el.style.transition = 'transform .22s ease, opacity .22s ease';
      if (direction === 'left') el.style.transform = 'translate3d(-120%,0,0)';
      else if (direction === 'right') el.style.transform = 'translate3d(120%,0,0)';
      else el.style.transform = 'translate3d(0,-28px,0)';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 230);
    }

    function openModal(html, large=false) {
      const root = document.getElementById('modalRoot');
      root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${large ? 'large' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
      const back = document.getElementById('modalBackdrop');
      back.addEventListener('mousedown', e => { if (e.target === back) closeModal(); });
      document.addEventListener('keydown', modalEsc, {once:true});
    }

    function modalEsc(e) { if (e.key === 'Escape') closeModal(); }
    function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

    function setSession(token, user) {
      state.token = token;
      state.user = user;
      localStorage.setItem(STORAGE.TOKEN, token);
      localStorage.setItem(STORAGE.USER, JSON.stringify(user));
    }

    function clearSession(showToast=true) {
      state.token = '';
      state.user = null;
      state.students = [];
      state.summary = null;
      state.dashboard = null;
      state.selectedStudentDetail = null;
      state.detailCache = {};
      state.summaryCache = {};
      localStorage.removeItem(STORAGE.TOKEN);
      localStorage.removeItem(STORAGE.USER);
      if (showToast) toast('Anda telah keluar dari aplikasi.', 'info');
    }

    function logout() {
      clearSession(true);
      state.loginRole = 'SISWA';
      renderLogin();
    }

    function saveStaffSnapshot() {
      if (!state.user || !['BENDAHARA','WALI'].includes(state.user.role)) return;
      try {
        localStorage.setItem(STORAGE.STAFF_SNAPSHOT, JSON.stringify({
          userKey: state.user.idUser || state.user.username,
          savedAt: Date.now(),
          config: state.config,
          students: state.students,
          summary: state.summary,
          dashboard: state.dashboard,
          scopeMode: state.scopeMode,
          scopeMonthIndex: state.scopeMonthIndex,
          scopeClass: state.scopeClass
        }));
      } catch (_) {}
    }

    function loadStaffSnapshot() {
      const snap = safeJson(localStorage.getItem(STORAGE.STAFF_SNAPSHOT));
      if (!snap || !state.user) return null;
      const key = state.user.idUser || state.user.username;
      return snap.userKey === key ? snap : null;
    }

    function saveStudentSnapshot(detail) {
      if (!state.user || state.user.role !== 'SISWA') return;
      try { localStorage.setItem(STORAGE.STUDENT_SNAPSHOT, JSON.stringify({nisn:state.user.nisn, savedAt:Date.now(), config:state.config, detail})); } catch (_) {}
    }

    function loadStudentSnapshot() {
      const snap = safeJson(localStorage.getItem(STORAGE.STUDENT_SNAPSHOT));
      return snap && state.user?.nisn === snap.nisn ? snap : null;
    }

    async function loadPublicConfig() {
      if (!isApiConfigured() || !navigator.onLine) return;
      try {
        const data = await api('publicConfig', {}, {silent:true, timeout:10000});
        state.config = Object.assign({}, DEFAULT_CONFIG, data || {});
      } catch (_) {}
    }

    // ========================= ANTREAN PEMBAYARAN OFFLINE =========================

    function getPaymentQueue() {
      const q = safeJson(localStorage.getItem(STORAGE.QUEUE));
      return Array.isArray(q) ? q : [];
    }

    function savePaymentQueue(queue) {
      localStorage.setItem(STORAGE.QUEUE, JSON.stringify(queue));
      updateSyncIndicator();
    }

    function queueCount() { return getPaymentQueue().length; }

    function pendingPayment(idSiswa, bulan, tahun) {
      return getPaymentQueue().find(x => x.idSiswa === idSiswa && x.bulan === bulan && Number(x.tahun) === Number(tahun)) || null;
    }

    function makeClientTransactionId() {
      const random = (globalThis.crypto?.getRandomValues ? Array.from(crypto.getRandomValues(new Uint32Array(2))).map(n=>n.toString(36)).join('') : Math.random().toString(36).slice(2,14));
      return `TRX-LOCAL-${Date.now().toString(36)}-${random}`.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,64);
    }

    function enqueuePayment(idSiswa, bulan, tahun, student) {
      const queue = getPaymentQueue();
      const existing = queue.find(x => x.idSiswa === idSiswa && x.bulan === bulan && Number(x.tahun) === Number(tahun));
      if (existing) return {item:existing, duplicate:true};
      const item = {
        clientId: makeClientTransactionId(),
        idSiswa,
        bulan,
        tahun:Number(tahun),
        student: {nama:student?.nama || '', nisn:student?.nisn || '', kelas:student?.kelas || ''},
        createdAt: Date.now(),
        attempts: 0,
        lastError: ''
      };
      queue.push(item);
      savePaymentQueue(queue);
      return {item, duplicate:false};
    }

    function removeQueueItem(clientId) {
      savePaymentQueue(getPaymentQueue().filter(x => x.clientId !== clientId));
    }

    function updateQueueFailure(clientId, message) {
      const queue = getPaymentQueue();
      const item = queue.find(x => x.clientId === clientId);
      if (item) {
        item.attempts = Number(item.attempts || 0) + 1;
        item.lastError = String(message || '');
        item.lastAttemptAt = Date.now();
        savePaymentQueue(queue);
      }
    }

    function syncChipHtml() {
      if (state.user?.role !== 'BENDAHARA') return '';
      const count = queueCount();
      const offline = !navigator.onLine;
      const cls = offline ? 'offline' : count ? 'pending' : 'ok';
      const ic = offline ? 'offline' : count ? 'clock' : 'cloud';
      const text = offline ? (count ? `${count} tertunda` : 'Offline') : (count ? `${count} tertunda` : 'Sinkron');
      return `<button id="syncChip" class="sync-chip ${cls}" onclick="syncPaymentQueue({manual:true})" title="Status sinkronisasi">${icon(ic)}<span>${escapeHtml(text)}</span></button>`;
    }

    function updateSyncIndicator() {
      const old = document.getElementById('syncChip');
      if (old && state.user?.role === 'BENDAHARA') {
        const wrap = document.createElement('div');
        wrap.innerHTML = syncChipHtml();
        old.replaceWith(wrap.firstElementChild);
      }
    }

    async function syncPaymentQueue({manual=false}={}) {
      if (state.syncing || state.user?.role !== 'BENDAHARA' || !state.token) return 0;
      const queue = getPaymentQueue();
      if (!queue.length) {
        if (manual) toast('Tidak ada pembayaran yang menunggu sinkronisasi.', 'info', 'Semua sudah sinkron');
        updateSyncIndicator();
        return 0;
      }
      if (!navigator.onLine) {
        if (manual) toast(`${queue.length} pembayaran tetap aman di perangkat dan akan dikirim saat internet tersedia.`, 'warning', 'Masih offline');
        updateSyncIndicator();
        return 0;
      }

      state.syncing = true;
      updateSyncIndicator();
      let synced = 0;
      let hadNetworkFailure = false;
      try {
        for (const item of getPaymentQueue()) {
          try {
            const tx = await api('addPayment', {
              token: state.token,
              idSiswa: item.idSiswa,
              bulan: item.bulan,
              tahun: item.tahun,
              clientTransactionId: item.clientId
            }, {silent:true, timeout:10000});

            removeQueueItem(item.clientId);
            synced++;
            applyServerPaymentLocally(tx);
            toast(`Pembayaran ${tx.student.nama} • ${titleCase(tx.bulan)} ${tx.tahun} sudah tersimpan di server.`, 'success', 'Tersimpan di server', 4300);
          } catch (err) {
            const message = err?.message || 'Gagal mengirim pembayaran.';
            if (/sudah tercatat lunas/i.test(message)) {
              removeQueueItem(item.clientId);
              synced++;
              toast(`${item.student.nama || 'Siswa'} • ${titleCase(item.bulan)} ${item.tahun} sudah tercatat di server.`, 'info', 'Sudah tercatat');
              continue;
            }
            updateQueueFailure(item.clientId, message);
            if (isSessionError(message)) {
              toast(message, 'error');
              break;
            }
            if (isNetworkLikeError(err)) hadNetworkFailure = true;
            if (manual || Number(item.attempts || 0) === 0) {
              toast('Pembayaran belum sampai ke server. Data tetap tersimpan di perangkat dan akan dicoba lagi otomatis.', 'warning', 'Menunggu sinkronisasi', 5200);
            }
            break;
          }
        }
      } finally {
        state.syncing = false;
        updateSyncIndicator();
      }

      if (synced > 0 && queueCount() === 0) scheduleSilentStaffRefresh();
      if (manual && hadNetworkFailure) toast('Koneksi belum stabil. Pembayaran yang belum terkirim tetap tersimpan di perangkat.', 'warning', 'Sinkronisasi belum selesai');
      return synced;
    }

    function applyServerPaymentLocally(tx) {
      if (!tx?.student?.idSiswa) return;
      delete state.detailCache[tx.student.idSiswa];
      state.summaryCache = {};
      if (state.selectedStudentDetail?.student?.idSiswa === tx.student.idSiswa) {
        const d = state.selectedStudentDetail;
        const p = d.periods.find(x => x.bulan === tx.bulan && Number(x.tahun) === Number(tx.tahun));
        if (p && p.status !== 'LUNAS') {
          p.status = 'LUNAS';
          p.nominal = tx.nominal;
          p.idTransaksi = tx.idTransaksi;
          if (!d.history.some(h => h.idTransaksi === tx.idTransaksi)) d.history.unshift({
            idTransaksi:tx.idTransaksi, bulan:tx.bulan, tahun:tx.tahun, nominal:tx.nominal,
            tanggalBayar:tx.tanggalBayar, waktuBayar:tx.waktuBayar, status:'LUNAS'
          });
          d.paidMonths = d.periods.filter(x => x.status === 'LUNAS').length;
          d.paidAmount = d.history.reduce((sum,h)=>sum+Number(h.nominal||0),0);
        }
      }
    }

      if (state.user?.role !== 'BENDAHARA') return;

    async function refreshCurrentData(silent=false) {
      if (state.refreshBusy || !state.user) return;
      state.refreshBusy = true;
      const btn = document.getElementById('refreshBtn');
      btn?.classList.add('spinning');
      try {
        if (state.user.role === 'BENDAHARA') await syncPaymentQueue({manual:false});
        if (!navigator.onLine) throw new Error('Tidak ada koneksi internet. Data terakhir tetap ditampilkan.');

        if (state.user.role === 'SISWA') {
          const d = await api('studentDetail', {token:state.token, force:true}, {silent:true, timeout:16000});
          state.selectedStudentDetail = d;
          state.detailCache[d.student.idSiswa] = d;
          saveStudentSnapshot(d);
          renderStudentApp(d);
        } else {
          const data = await api('staffBootstrap', Object.assign({token:state.token, force:true}, scopePayload(false)), {silent:true, timeout:20000});
          applyBootstrap(data, true);
          renderCurrentStaffView();
        }
        if (!silent) toast('Data terbaru berhasil diambil dari server.', 'success', 'Data diperbarui');
      } catch (err) {
        if (!silent) toast(err.message || 'Data belum dapat diperbarui.', 'warning', 'Refresh gagal');

        document.getElementById('refreshBtn')?.classList.remove('spinning');
        updateSyncIndicator();

    }

    // ========================= PERIODE / REKAP =========================

    function currentScopePeriod() {
      const periods = state.config.periods || [];
      return periods[state.scopeMonthIndex] || state.config.currentPeriod || periods[0];
    }

    function setDefaultScopeFromConfig() {
      const p = state.config.currentPeriod || state.config.periods?.[0];
      const index = state.config.periods.findIndex(x => x.bulan === p?.bulan && Number(x.tahun) === Number(p?.tahun));
      state.scopeMode = 'MONTH';
      state.scopeMonthIndex = index >= 0 ? index : 0;
      state.scopeClass = '';
    }

    function scopePayload(force=false) {
      const p = currentScopePeriod();
      return {
        mode: state.scopeMode,
        bulan: p?.bulan || '',
        tahun: p?.tahun || '',
        kelas: state.user?.role === 'BENDAHARA' ? state.scopeClass : '',
        force: !!force
      };
    }

    function summaryCacheKey() {
      const p = currentScopePeriod();
      return [state.scopeMode, p?.bulan || '', p?.tahun || '', state.user?.role === 'BENDAHARA' ? state.scopeClass : state.user?.kelas || ''].join('|');
    }

    function rememberCurrentSummary() {
      if (state.summary) state.summaryCache[summaryCacheKey()] = state.summary;
    }

    function applyBootstrap(data, preserveScope=true) {
      if (!data) return;
      state.config = Object.assign({}, DEFAULT_CONFIG, data.config || state.config || {});
      state.students = Array.isArray(data.students) ? data.students : state.students;
      state.dashboard = data.dashboard || state.dashboard;
      state.summary = data.summary || state.summary;
      state.detailCache = preserveScope ? state.detailCache : {};
      state.summaryCache = preserveScope ? state.summaryCache : {};

      const scope = data.summary?.scope || data.dashboard?.scope;
      if (scope) {
        state.scopeMode = scope.mode || 'MONTH';
        const anchor = scope.anchor || scope.periods?.[0];
        const idx = state.config.periods.findIndex(p => p.bulan === anchor?.bulan && Number(p.tahun) === Number(anchor?.tahun));
        if (idx >= 0) state.scopeMonthIndex = idx;
      } else if (!preserveScope) setDefaultScopeFromConfig();
      if (state.user?.role === 'BENDAHARA') state.scopeClass = data.summary?.kelas === 'SEMUA' ? '' : (data.summary?.kelas || state.scopeClass || '');
      rememberCurrentSummary();
      saveStaffSnapshot();
    }

    function periodControlsHtml() {
      const p = currentScopePeriod();
      const isMonth = state.scopeMode === 'MONTH';
      const isB = state.user?.role === 'BENDAHARA';
      const modes = [['MONTH','Bulan'],['SEM1','Semester 1'],['SEM2','Semester 2'],['YEAR','Tahun Ajaran']];
      const scopeLabel = state.summary?.scope?.label || state.dashboard?.scope?.label || (isMonth ? p?.label : state.scopeMode);
      return `<section class="period-panel" id="periodPanel">
        <div class="period-segment">${modes.map(([mode,label])=>`<button class="${state.scopeMode===mode?'active':''}" onclick="changeScopeMode('${mode}')">${label}</button>`).join('')}</div>
        <div class="period-row">
          ${isMonth ? `<div class="period-nav"><button class="period-arrow" onclick="moveScopeMonth(-1)" ${state.scopeMonthIndex<=0?'disabled':''}>${icon('left')}</button><div class="period-label">${escapeHtml(p?.label || '')}</div><button class="period-arrow" onclick="moveScopeMonth(1)" ${state.scopeMonthIndex>=state.config.periods.length-1?'disabled':''}>${icon('right')}</button></div>` : `<div class="period-static">${escapeHtml(scopeLabel)}</div>`}
          ${isB ? `<select class="select period-class" onchange="changeScopeClass(this.value)"><option value="" ${!state.scopeClass?'selected':''}>Semua Kelas</option>${state.config.classes.map(c=>`<option value="${escapeHtml(c.nama)}" ${state.scopeClass===c.nama?'selected':''}>${escapeHtml(c.nama)}</option>`).join('')}</select>` : `<div class="period-class-readonly">${escapeHtml(state.user?.kelas || '')}</div>`}
        </div>
      </section>`;
    }

    async function changeScopeMode(mode) {
      if (!['MONTH','SEM1','SEM2','YEAR'].includes(mode) || mode === state.scopeMode) return;
      state.scopeMode = mode;
      await loadScopeSummary();
    }

    async function moveScopeMonth(delta) {
      if (state.scopeMode !== 'MONTH') return;
      const next = Math.max(0, Math.min(state.config.periods.length - 1, state.scopeMonthIndex + Number(delta || 0)));
      if (next === state.scopeMonthIndex) return;
      state.scopeMonthIndex = next;
      await loadScopeSummary();
    }

    async function changeScopeClass(value) {
      if (state.user?.role !== 'BENDAHARA') return;
      state.scopeClass = value || '';
      await loadScopeSummary();
    }

    async function loadScopeSummary(force=false) {
      const key = summaryCacheKey();
      if (!force && state.summaryCache[key]) {
        state.summary = state.summaryCache[key];
        state.dashboard = {user:state.user, scope:state.summary.scope, stats:summaryStatsFromSummary(state.summary.summary), config:state.config};
        renderCurrentStaffView();
        return;
      }

      document.getElementById('periodPanel')?.classList.add('busy');
      try {
        const data = await api('summary', Object.assign({token:state.token}, scopePayload(force)), {silent:true, timeout:17000});
        state.summary = data;
        state.dashboard = {user:state.user, scope:data.scope, stats:summaryStatsFromSummary(data.summary), config:state.config};
        state.summaryCache[key] = data;
        saveStaffSnapshot();
        renderCurrentStaffView();
      } catch (err) {
        toast(err.message || 'Rekap belum dapat diperbarui.', 'warning');
      } finally {
        document.getElementById('periodPanel')?.classList.remove('busy');
      }
    }

        </section>
        ${isB ? `
          <div class="section-head"><div><h2>Akses cepat</h2><p>Fitur utama untuk pencatatan dan pemantauan Komite.</p></div></div>

          <div class="card card-pad">${summaryStudentsHtml(state.summary?.summary?.students || [], true)}</div>
        `}`;
    }

    // ========================= DATA SISWA =========================

    function renderStudentsView() {
      const canClass = state.user.role === 'BENDAHARA';
      const html = `
        <div class="section-head"><div><h2>${canClass?'Data Siswa':'Murid '+escapeHtml(state.user.kelas)}</h2><p>${state.students.length} data aktif • tersimpan di cache aplikasi</p></div>${canClass?`<button class="btn btn-primary btn-sm" onclick="openPaymentSearch()">${icon('plus')} Catat Pembayaran</button>`:''}</div>

          <div class="toolbar ${canClass?'three':''}">
            <div class="field-wrap"><span class="field-icon">${icon('search')}</span><input id="studentSearch" class="input" placeholder="Cari nama atau NISN" oninput="filterStudentsView()"></div>
            ${canClass ? `<select id="studentClass" class="select" onchange="filterStudentsView()"><option value="">Semua kelas</option>${state.config.classes.map(c=>`<option value="${escapeHtml(c.nama)}">${escapeHtml(c.nama)}</option>`).join('')}</select>` : ''}
            <div></div>
          </div>
          <div id="studentList" class="student-list"></div>
        </section>`;
      renderStaffShell(html);
      filterStudentsView();
    }

    function studentRowHtml(s, paymentMode=false) {
      return `<button class="student-row" onclick="openStudentDetail('${escapeHtml(s.idSiswa)}', ${paymentMode})">
        <span class="avatar">${escapeHtml(initials(s.nama).toUpperCase())}</span>
        <span class="student-main"><strong>${escapeHtml(s.nama)}</strong><span class="student-meta"><span>${escapeHtml(s.kelas)}</span><span>•</span><span>NISN ${escapeHtml(s.nisn)}</span>${Number.isFinite(s.paidMonths)?`<span>•</span><span>${s.paidMonths}/12 lunas</span>`:''}</span></span>
        <span class="chev">${icon('chevron')}</span>
      </button>`;
    }

    function filterStudentsView() {
      const q = (document.getElementById('studentSearch')?.value || '').toLowerCase().trim();
      const k = document.getElementById('studentClass')?.value || '';
      const list = state.students.filter(s => (!q || s.nama.toLowerCase().includes(q) || s.nisn.toLowerCase().includes(q)) && (!k || s.kelas===k));
      const target = document.getElementById('studentList');
      if (target) target.innerHTML = list.length ? list.map(studentRowHtml).join('') : emptyHtml('Siswa tidak ditemukan','Coba kata pencarian atau kelas yang lain.');
    }

    // ========================= CATAT PEMBAYARAN =========================

    function openPaymentSearch() {
      if (!state.students.length) {
        toast('Data siswa belum tersedia. Tekan Refresh untuk mengambil data terbaru.', 'warning');
        return;
      }
      openModal(`
        <div class="modal-head"><div><h3>Catat Pembayaran</h3><p>Cari siswa, lalu pilih bulan Pembayaran Komite.</p></div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
        <div class="modal-body">
          ${queueCount()?`<div class="sync-notice">${icon('clock')} <span><strong>${queueCount()} pembayaran menunggu sinkronisasi.</strong> Anda tetap dapat mencatat pembayaran berikutnya.</span></div>`:''}
          <div class="toolbar three">
            <div class="field-wrap"><span class="field-icon">${icon('search')}</span><input id="paySearch" class="input" placeholder="Cari nama atau NISN" oninput="filterPaymentStudents()" autofocus></div>
            <select id="payClass" class="select" onchange="filterPaymentStudents()"><option value="">Semua kelas</option>${state.config.classes.map(c=>`<option value="${escapeHtml(c.nama)}">${escapeHtml(c.nama)}</option>`).join('')}</select>
            <div></div>
          </div>
          <div id="payStudentList" class="student-list"></div>
        </div>`, true);
      filterPaymentStudents();
      setTimeout(()=>document.getElementById('paySearch')?.focus(),50);
    }

    function filterPaymentStudents() {
      const q = (document.getElementById('paySearch')?.value || '').toLowerCase().trim();
      const k = document.getElementById('payClass')?.value || '';
      const list = state.students.filter(s => (!q || s.nama.toLowerCase().includes(q) || s.nisn.toLowerCase().includes(q)) && (!k || s.kelas===k)).slice(0,100);
      const target = document.getElementById('payStudentList');
      if (target) target.innerHTML = list.length ? list.map(s=>studentRowHtml(s,true)).join('') : emptyHtml('Siswa tidak ditemukan','Periksa nama, NISN, atau kelas.');
    }

    async function openStudentDetail(idSiswa, paymentMode=false, force=false) {
      try {
        let d = !force ? state.detailCache[idSiswa] : null;
        if (!d && !navigator.onLine) d = buildLocalStudentDetail(idSiswa);
        if (!d) {
          try {
            d = await api('studentDetail', {token:state.token,idSiswa,force}, {loadingText:'Memuat pembayaran siswa…', timeout:16000});
          } catch (err) {
            if (isNetworkLikeError(err)) d = buildLocalStudentDetail(idSiswa);
            if (!d) throw err;
          }
          state.detailCache[idSiswa] = d;
        }
        state.selectedStudentDetail = d;
        const isB = state.user.role === 'BENDAHARA';
        openModal(studentDetailModalHtml(d, paymentMode && isB), true);
      } catch (err) { toast(err.message,'error'); }
    }

    function buildLocalStudentDetail(idSiswa) {
      const s = state.students.find(x => x.idSiswa === idSiswa);
      if (!s) return null;
      const paidSet = new Set(Array.isArray(s.paidPeriods) ? s.paidPeriods : []);
      const current = state.config.currentPeriod;
      const currentIndex = state.config.periods.findIndex(p => p.bulan === current?.bulan && Number(p.tahun) === Number(current?.tahun));
      const periods = state.config.periods.map((p, index) => {
        const key = `${p.bulan}-${p.tahun}`;
        const paid = paidSet.has(key);
        return {
          bulan:p.bulan, tahun:p.tahun, label:p.label,
          status: paid ? 'LUNAS' : (currentIndex >= 0 && index <= currentIndex ? 'BELUM_BAYAR' : 'BELUM_JATUH_TEMPO'),
          nominal:Number(state.config.amount||50000), idTransaksi:''
        };
      });
      return {
        student:{idSiswa:s.idSiswa,nisn:s.nisn,nama:s.nama,kelas:s.kelas},
        paidMonths:periods.filter(p=>p.status==='LUNAS').length,
        totalMonths:periods.length,
        paidAmount:periods.filter(p=>p.status==='LUNAS').length * Number(state.config.amount||50000),
        periods, history:[], offlineApprox:true
      };
    }

    function studentDetailModalHtml(d, paymentMode) {
      const s = d.student;
      const pending = getPaymentQueue().filter(x=>x.idSiswa===s.idSiswa).length;
      return `
        <div class="modal-head"><div><h3>${escapeHtml(s.nama)}</h3><p>${escapeHtml(s.kelas)} • NISN ${escapeHtml(s.nisn)} • ${d.paidMonths}/12 bulan lunas${pending?` • ${pending} menunggu sinkron`:''}</p></div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
        <div class="modal-body">
          <div class="section-head" style="margin-top:0"><div><h2>Pembayaran ${escapeHtml(state.config.schoolYear)}</h2><p>${paymentMode?'Pilih bulan yang akan dibayar.':'Status Pembayaran Komite per bulan.'}</p></div><span class="status-pill ok">${icon('check')} ${money(d.paidAmount)}</span></div>
          <div class="months-grid">${d.periods.map(p=>monthCardHtml(p, s.idSiswa, paymentMode)).join('')}</div>
          <div class="section-head"><div><h2>Riwayat Pembayaran</h2><p>${d.offlineApprox ? 'Riwayat lengkap tersedia saat online' : (d.history.length ? d.history.length+' transaksi lunas' : 'Belum ada transaksi')}</p></div></div>
          <div class="card card-pad">${historyHtml(d.history, state.user.role === 'BENDAHARA')}</div>
        </div>`;
    }

    function monthCardHtml(p, idSiswa, paymentMode=false) {
      const pending = pendingPayment(idSiswa, p.bulan, p.tahun);
      const lunas = p.status === 'LUNAS';
      const due = p.status === 'BELUM_BAYAR';
      const status = pending
        ? `<span class="status-pill sync">${icon('clock')} Menunggu sinkron</span>`
        : lunas
          ? `<span class="status-pill ok">${icon('check')} Lunas</span>`
          : due ? `<span class="status-pill wait">${icon('clock')} Belum Bayar</span>`
          : `<span class="status-pill future">${icon('calendar')} Belum Jatuh Tempo</span>`;
      const clickable = paymentMode && !lunas && !pending;
      return `<div class="month-card ${clickable?'clickable':''}" ${clickable?`onclick="confirmPayment('${escapeHtml(idSiswa)}','${escapeHtml(p.bulan)}',${p.tahun})"`:''}>
        <div><div class="month-name">${escapeHtml(p.bulan.slice(0,3))}</div><div class="month-year">${p.tahun}</div></div>${status}
      </div>`;
    }

    function historyHtml(history, allowCancel=false) {
      if (!history.length) return emptyHtml('Belum ada pembayaran','Pembayaran yang telah tercatat akan muncul di sini.');
      return `<div class="history-list">${history.map(h=>`
        <div class="history-row">
          <div><strong>${titleCase(h.bulan)} ${h.tahun}</strong><div class="meta">${escapeHtml(h.tanggalBayar)} • ${escapeHtml(h.waktuBayar || '')}<br><span style="font-size:10px">${escapeHtml(h.idTransaksi)}</span></div></div>
          <div class="history-amount"><strong>${money(h.nominal)}</strong><div style="margin-top:6px;display:flex;justify-content:flex-end;gap:6px"><span class="status-pill ok">${icon('check')} Lunas</span>${allowCancel?`<button class="btn btn-soft btn-sm" title="Cetak bukti" onclick="printHistoryReceipt('${escapeHtml(h.idTransaksi)}')">${icon('printer')}</button><button class="btn btn-danger btn-sm" title="Batalkan" onclick="confirmCancel('${escapeHtml(h.idTransaksi)}')">${icon('trash')}</button>`:''}</div></div>
        </div>`).join('')}</div>`;
    }

    function confirmPayment(idSiswa, bulan, tahun) {
      const d = state.selectedStudentDetail;
      const s = d?.student;
      if (!s || s.idSiswa !== idSiswa) return;
      openModal(`
        <div class="modal-head"><div><h3>Konfirmasi Pembayaran</h3><p>Setelah ditekan, pencatatan langsung masuk antrean dan tidak perlu menunggu server.</p></div><button class="icon-btn" onclick="openStudentDetail('${escapeHtml(idSiswa)}',true)">${icon('x')}</button></div>
        <div class="modal-body">
          <div class="receipt">
            <div class="success-mark" style="color:var(--blue);background:#edf6ff">${icon('receipt')}</div>
            <div class="receipt-name">${escapeHtml(s.nama)}</div>
            <div style="color:var(--muted);font-size:12px">${escapeHtml(s.kelas)} • ${escapeHtml(s.nisn)}</div>
            <div class="receipt-amount">${money(state.config.amount)}</div>
            <div style="color:var(--muted)">Komite ${titleCase(bulan)} ${tahun}</div>
          </div>
        </div>
        <div class="modal-actions"><button class="btn btn-ghost" onclick="openStudentDetail('${escapeHtml(idSiswa)}',true)">Kembali</button><button class="btn btn-primary" onclick="savePayment('${escapeHtml(idSiswa)}','${escapeHtml(bulan)}',${tahun})">${icon('check')} Simpan Pembayaran</button></div>`);
    }

    function savePayment(idSiswa, bulan, tahun) {
      const d = state.selectedStudentDetail;
      const s = d?.student;
      if (!s || s.idSiswa !== idSiswa) return;
      const result = enqueuePayment(idSiswa, bulan, tahun, s);
      if (result.duplicate) {
        toast(`Pembayaran ${titleCase(bulan)} ${tahun} sudah berada dalam antrean sinkronisasi.`, 'warning', 'Sudah diantrikan');
        openPaymentSearch();
        return;
      }

      openPaymentSearch();
      if (navigator.onLine) toast(`Pembayaran ${s.nama} • ${titleCase(bulan)} ${tahun} sudah dicatat di perangkat dan sedang dikirim.`, 'info', 'Mengirim ke server');
      else toast(`Pembayaran ${s.nama} • ${titleCase(bulan)} ${tahun} tersimpan sementara di perangkat. Akan dikirim otomatis saat internet tersedia.`, 'warning', 'Tersimpan di perangkat', 5600);
      syncPaymentQueue();
    }

    function printHistoryReceipt(idTransaksi) {
      const d = state.selectedStudentDetail;
      const h = d?.history?.find(x => x.idTransaksi === idTransaksi);
      if (!d || !h) { toast('Data bukti belum tersedia. Tekan Refresh lalu coba lagi.','warning'); return; }
      printReceipt({
        idTransaksi:h.idTransaksi,
        student:d.student,
        bulan:h.bulan,
        tahun:h.tahun,
        nominal:h.nominal,
        tanggalBayar:h.tanggalBayar,
        waktuBayar:h.waktuBayar,
        status:'LUNAS'
      });
    }

    function printReceipt(tx) {
      const w = window.open('', '_blank', 'width=520,height=720');
      if (!w) { toast('Izinkan pop-up browser untuk mencetak bukti.','warning'); return; }
      w.document.write(`<!doctype html><html><head><title>${escapeHtml(tx.idTransaksi)}</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#16314d}main{max-width:420px;margin:auto;border:1px solid #dce6ef;border-radius:18px;padding:24px}h2{text-align:center;margin:0 0 4px}.sub{text-align:center;color:#65758a;font-size:12px}.amount{text-align:center;font-size:30px;font-weight:700;margin:20px 0}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:12px}.foot{text-align:center;color:#738395;font-size:10px;margin-top:20px}@media print{body{padding:0}main{border:0}}</style></head><body><main><h2>Komite SMP Negeri 3 Jayapura</h2><div class="sub">Bukti Pembayaran Komite</div><div class="amount">${money(tx.nominal)}</div><div class="row"><span>Nama</span><strong>${escapeHtml(tx.student.nama)}</strong></div><div class="row"><span>Kelas</span><strong>${escapeHtml(tx.student.kelas)}</strong></div><div class="row"><span>Periode</span><strong>${titleCase(tx.bulan)} ${tx.tahun}</strong></div><div class="row"><span>Tanggal</span><strong>${escapeHtml(tx.tanggalBayar)} ${escapeHtml(tx.waktuBayar)}</strong></div><div class="row"><span>No. Transaksi</span><strong>${escapeHtml(tx.idTransaksi)}</strong></div><div class="row"><span>Status</span><strong>LUNAS</strong></div><div class="foot">SMP Negeri 3 Jayapura • Tahun Pelajaran ${escapeHtml(state.config.schoolYear)}</div></main><script>window.onload=()=>{window.print()}<\/script></body></html>`);
      w.document.close();
    }

    function confirmCancel(idTransaksi) {
      openModal(`
        <div class="modal-head"><div><h3>Batalkan transaksi?</h3><p>Transaksi tidak dihapus, statusnya akan menjadi BATAL.</p></div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
        <div class="modal-body"><div class="card card-pad"><strong>${escapeHtml(idTransaksi)}</strong><p style="margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5">Gunakan hanya bila bendahara salah mencatat pembayaran. Jejak pembatalan tetap tersimpan pada LOG_AKTIVITAS.</p></div></div>
        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Tidak</button><button class="btn btn-danger" onclick="cancelPayment('${escapeHtml(idTransaksi)}')">${icon('trash')} Ya, Batalkan</button></div>`);
    }

    async function cancelPayment(idTransaksi) {
      try {
        const idSiswa = state.selectedStudentDetail?.student?.idSiswa;
        await api('cancelPayment', {token:state.token,idTransaksi}, {loadingText:'Membatalkan transaksi…'});
        toast('Transaksi berhasil dibatalkan dan jejaknya tetap tersimpan.', 'success');
        state.detailCache = {};
        state.summaryCache = {};
        if (navigator.onLine) {
          const data = await api('staffBootstrap', Object.assign({token:state.token}, scopePayload(false)), {silent:true});
          applyBootstrap(data, true);
        }
        if (idSiswa) await openStudentDetail(idSiswa, false, true); else closeModal();
      } catch (err) { toast(err.message,'error'); }
    }

    // ========================= REKAP =========================

    function renderSummaryView() {
      const html = `
        ${periodControlsHtml()}
        <div class="section-head"><div><h2>Rekap Pembayaran</h2><p>Ringkasan Pembayaran Komite sesuai periode dan kelas yang dipilih.</p></div><button class="btn btn-soft btn-sm" onclick="downloadSummaryCsv()">${icon('download')} Unduh CSV</button></div>
        <section class="card card-pad"><div id="summaryBody">${summaryBodyHtml(state.summary)}</div></section>`;
      renderStaffShell(html);
    }

    function summaryBodyHtml(data) {
      const s = data?.summary || {};
      const scope = data?.scope || {};
      const many = (scope.periods?.length || 1) > 1;
      return `<div class="summary-grid">
        <div class="metric"><span>Siswa</span><strong>${s.totalStudents||0}</strong></div>
        <div class="metric"><span>${many?'Pembayaran Lunas':'Lunas'}</span><strong style="color:var(--green)">${s.paid||0}${many?`/${s.totalSlots||0}`:''}</strong></div>
        <div class="metric"><span>Belum</span><strong style="color:var(--orange)">${s.unpaid||0}</strong></div>
        <div class="metric"><span>Terkumpul</span><strong style="font-size:19px">${money(s.totalAmount||0)}</strong></div>
      </div>
      <div class="section-head"><div><h2>Daftar Siswa</h2><p>${escapeHtml(scope.label || '')} • ${escapeHtml(data?.kelas || 'SEMUA')}${Number(s.future||0)>0?` • ${s.future} pembayaran belum jatuh tempo`:''}</p></div><span class="status-pill ok">${s.percentage||0}% lunas</span></div>
      ${summaryStudentsHtml(s.students || [], false)}`;
    }

    function summaryStudentsHtml(list, preview=false) {
      const rows = preview ? list.slice(0,6) : list;
      if (!rows.length) return emptyHtml('Belum ada siswa','Isi data pada sheet SISWA.');
      const many = (state.summary?.scope?.periods?.length || 1) > 1;
      return `<div class="student-list" style="margin-top:0">${rows.map(x=>{
        let cls = 'future', txt = 'Belum Jatuh Tempo', ic = 'calendar';
        if (x.status === 'LUNAS') { cls='ok'; txt = many ? `${x.paidMonths}/${x.totalMonths} lunas` : 'Lunas'; ic='check'; }
        else if (x.status === 'BELUM_BAYAR') { cls='wait'; txt = many ? `${x.paidMonths}/${x.totalMonths} lunas` : 'Belum'; ic='clock'; }
        else if (x.status === 'SEBAGIAN') { cls='sync'; txt=`${x.paidMonths}/${x.totalMonths} lunas`; ic='clock'; }
        return `<button class="student-row" onclick="openStudentDetail('${escapeHtml(x.idSiswa)}',false)"><span class="avatar">${escapeHtml(initials(x.nama).toUpperCase())}</span><span class="student-main"><strong>${escapeHtml(x.nama)}</strong><span class="student-meta">${escapeHtml(x.kelas)} • NISN ${escapeHtml(x.nisn)}</span></span><span class="status-pill ${cls}">${icon(ic)} ${escapeHtml(txt)}</span></button>`;
      }).join('')}</div>`;
    }

    function downloadSummaryCsv() {
      const d = state.summary;
      if (!d?.summary?.students) { toast('Rekap belum tersedia.','warning'); return; }
      const many = (d.scope?.periods?.length || 1) > 1;
      const rows = many
        ? [['NISN','NAMA_SISWA','KELAS','PERIODE','LUNAS','TOTAL_BULAN','STATUS']]
        : [['NISN','NAMA_SISWA','KELAS','PERIODE','STATUS']];
      d.summary.students.forEach(s => {
        if (many) rows.push([s.nisn,s.nama,s.kelas,d.scope.label,s.paidMonths,s.totalMonths,s.status]);
        else rows.push([s.nisn,s.nama,s.kelas,d.scope.label,s.status]);
      });
      const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Rekap_Komite_${String(d.scope.label||'Periode').replace(/\s+/g,'_')}_${(d.kelas||'SEMUA').replace(/\s+/g,'_')}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
      toast('Rekap CSV berhasil dibuat.','success');
    }

          </div>
          <div class="paid-circle"><div><strong>${d.paidMonths}/${d.totalMonths}</strong><span>Bulan Lunas</span></div></div>

    }

    // ========================= RESTORE / NETWORK EVENTS =========================

    async function restoreSession() {
      if (!state.token || !state.user) return false;
      if (state.user.role === 'SISWA') {
        const snap = loadStudentSnapshot();
        if (snap?.detail) {
          state.config = Object.assign({}, state.config, snap.config || {});
          state.selectedStudentDetail = snap.detail;
          state.detailCache[snap.detail.student.idSiswa] = snap.detail;
          renderStudentApp(snap.detail);
        }
        if (!navigator.onLine) {
          if (snap?.detail) { toast('Menampilkan data terakhir karena perangkat sedang offline.', 'warning', 'Mode offline'); return true; }
          return false;
        }
        try {
          const d = await api('studentDetail', {token:state.token}, {silent:true, timeout:15000});
          state.selectedStudentDetail = d;
          state.detailCache[d.student.idSiswa] = d;
          saveStudentSnapshot(d);
          renderStudentApp(d);
          return true;
        } catch (err) {
          if (isSessionError(err.message)) { clearSession(false); return false; }
          if (snap?.detail) return true;
          return false;
        }
      }

      const snap = loadStaffSnapshot();
      if (snap) {
        state.config = Object.assign({}, state.config, snap.config || {});
        state.students = snap.students || [];
        state.summary = snap.summary || null;
        state.dashboard = snap.dashboard || null;
        state.scopeMode = snap.scopeMode || 'MONTH';
        state.scopeMonthIndex = Number.isFinite(snap.scopeMonthIndex) ? snap.scopeMonthIndex : 0;
        state.scopeClass = snap.scopeClass || '';
        rememberCurrentSummary();
        renderStaffShell();
      }
      if (!navigator.onLine) {
        if (snap) {
          toast('Menampilkan data terakhir. Pembayaran baru tetap dapat dicatat dan akan disinkronkan saat internet kembali.', 'warning', 'Mode offline', 6200);
          return true;
        }
        return false;
      }

      try {
        const data = await api('staffBootstrap', Object.assign({token:state.token}, scopePayload(false)), {silent:true, timeout:19000});
        applyBootstrap(data, true);
        renderCurrentStaffView();
        if (state.user.role === 'BENDAHARA') setTimeout(() => syncPaymentQueue(), 350);
        return true;
      } catch (err) {
        if (isSessionError(err.message)) { clearSession(false); return false; }
        if (snap) return true;
        return false;
      }
    }

    async function boot() {
      await loadPublicConfig();
      if (!state.scopeMonthIndex && state.config?.currentPeriod) {
        const idx = state.config.periods.findIndex(p=>p.bulan===state.config.currentPeriod.bulan && Number(p.tahun)===Number(state.config.currentPeriod.tahun));
        if (idx >= 0) state.scopeMonthIndex = idx;
      }
      const restored = await restoreSession();
      if (!restored) renderLogin();
      updateSyncIndicator();
    }

    window.addEventListener('online', () => {
      updateSyncIndicator();
      if (state.user) toast('Internet kembali tersedia. Data yang tertunda akan disinkronkan.', 'info', 'Koneksi kembali');
      if (state.user?.role === 'BENDAHARA') syncPaymentQueue();
    });

    window.addEventListener('offline', () => {
      updateSyncIndicator();
      if (state.user) toast('Koneksi terputus. Data terakhir tetap dapat dilihat, dan pembayaran Bendahara akan diantrikan di perangkat.', 'warning', 'Mode offline', 5600);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && navigator.onLine && state.user?.role === 'BENDAHARA' && queueCount()) syncPaymentQueue();
    });

    boot();

  </script>
</body>
</html>
